<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Day on Rails</title>
<meta name="description" content="Every scheduled train over one day — Germany, the USA, Greater Tokyo and Berlin — animated from the real timetables.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* The page ignores the viewer's light/dark preference on purpose: it is a
     night map at every hour, so the trains stay the brightest thing on it. */
  :root{
    --bg-bot:#0a1018;
    --ink:#e9eff7; --ink-2:#a7b3c4; --ink-3:#78859a;
    --rule:rgba(39,51,63,0.7); --panel:rgba(13,20,30,0.82);
    --ice:#5aa9ff; --ic:#ff7a45; --reg:#35d69a; --night:#ffd93d; --tram:#ff8fd8;
    --mtn:#b98cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg-bot);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #stage{position:fixed;inset:0;overflow:hidden}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* The glow layer keeps a small backing store; the CSS stretch is the blur,
     and the compositor does the additive blend instead of a canvas blit. */
  /* Two fingers belong to the map, one finger still scrolls the page down
     to the legend and the controls. */
  #map{touch-action:pan-y}
  #glow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
        mix-blend-mode:screen;mix-blend-mode:plus-lighter}
  #glow[hidden]{display:none}
  #dock{display:contents}

  /* ---- network switcher ------------------------------------------------ */
  /* One app, four networks. The pills sit in the top-left corner on every
     screen size, so switching never needs a scroll. */
  #nets{
    position:fixed;z-index:6;left:14px;top:14px;
    display:flex;gap:4px;padding:4px;
    /* Eight networks overflow a phone's width: let the row wrap rather than
       run off the screen, and keep it clear of the map's right half. */
    flex-wrap:wrap;max-width:calc(100vw - 40px);
  }
  #nets button{
    padding:4px 10px;font-size:0.72rem;border:1px solid transparent;
    color:var(--ink-3);
  }
  #nets button[aria-pressed="true"]{color:var(--ink);border-color:var(--rule)}
  /* The US region picker sits right under the network pills, on the map,
     so it is reachable without a scroll on any screen. */
  #regions{
    position:fixed;z-index:6;left:14px;top:56px;
    display:flex;gap:4px;padding:4px;flex-wrap:wrap;max-width:70vw;
  }
  #regions[hidden]{display:none}
  #regions button{
    padding:3px 9px;font-size:0.7rem;border:1px solid transparent;
    color:var(--ink-3);
  }
  #regions button[aria-pressed="true"]{color:var(--ink);border-color:var(--rule)}
  body[data-regions] #meta{top:96px}

  /* ---- clock ---------------------------------------------------------- */
  header{
    position:absolute;z-index:3;
    text-align:center;pointer-events:none;white-space:nowrap;
    transform:translate(-50%,-50%);
    text-shadow:0 0 10px var(--bg-bot), 0 0 4px var(--bg-bot);
  }
  #clock{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-weight:300;
    font-size:clamp(2rem,4.6vw,3rem);
    line-height:1;
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  #clock .mins{opacity:0.6}
  #running{
    margin-top:2px;font-size:0.68rem;letter-spacing:0.06em;color:var(--ink-3);
    font-family:"IBM Plex Mono",monospace;
  }
  /* The clock hints when the night fast-forward is running. */
  #running[data-ffwd="true"]::after{content:" · fast-forwarding the night"}

  /* ---- panels --------------------------------------------------------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  #legend{position:fixed;z-index:3;left:20px;bottom:20px;padding:13px 15px 11px;min-width:222px;max-width:330px}
  #legend h2,#figures h2{
    font-size:0.62rem;letter-spacing:0.17em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;margin-bottom:9px;
  }
  .lg{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:0.83rem}
  .sw{border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--panel)}
  .lg .nm{flex:1 1 auto;color:var(--ink)}
  .lg .ct{
    font-family:"IBM Plex Mono",monospace;font-size:0.76rem;
    color:var(--ink-2);font-variant-numeric:tabular-nums;
  }
  #legend footer{
    margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);
    font-size:0.66rem;line-height:1.45;color:var(--ink-3);
  }

  #controls{
    position:fixed;z-index:3;right:20px;bottom:20px;padding:11px 14px;
    display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:0.78rem;color:var(--ink);
    background:transparent;border:1px solid var(--rule);
    border-radius:6px;padding:5px 11px;cursor:pointer;
    transition:background 0.15s,border-color 0.15s;
  }
  button:hover{background:rgba(128,128,128,0.13)}
  button[aria-pressed="true"]{border-color:currentColor}
  #play{min-width:64px}
  .spd{display:flex;gap:5px}
  .spd button{padding:5px 8px;font-family:"IBM Plex Mono",monospace;font-size:0.72rem}
  /* Bloom controls: a toggle, then two small sliders that only appear when
     the glow is on. */
  #bloomctl label{
    display:flex;align-items:center;gap:4px;
    font-size:0.66rem;color:var(--ink-3);
  }
  #bloomctl[data-on="false"] label{display:none}
  #bloomctl input[type=range]{width:64px;accent-color:var(--ink-3)}
  /* The scrubber is a transparent range input laid over the day profile, so
     pointer, touch and keyboard seeking all stay native; its thumb is the
     playhead. */
  #profile{position:relative;width:268px;height:40px}
  #profcv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #scrub{
    position:absolute;inset:0;margin:0;width:100%;height:100%;
    -webkit-appearance:none;appearance:none;background:transparent;
    outline:none;cursor:pointer;
  }
  #scrub::-webkit-slider-runnable-track{background:transparent;height:100%}
  #scrub::-moz-range-track{background:transparent;height:100%}
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none;width:3px;height:40px;border-radius:1px;
    background:var(--ink);cursor:pointer;
  }
  #scrub::-moz-range-thumb{
    width:3px;height:40px;border:0;border-radius:1px;background:var(--ink);cursor:pointer;
  }
  #scrub:focus-visible{outline:1px solid var(--ink-3);outline-offset:2px}

  /* ---- provenance + table --------------------------------------------- */
  #meta{
    position:absolute;z-index:3;left:14px;top:52px;max-width:250px;
    font-size:0.68rem;line-height:1.5;color:var(--ink-3);
    background:rgba(5,8,14,.62);padding:9px 12px;border-radius:8px;
  }
  #meta strong{color:var(--ink-2);font-weight:500}
  #figbtn{position:fixed;z-index:4;right:20px;top:20px}
  #figures{position:fixed;z-index:3;right:20px;top:60px;padding:14px 16px;max-width:335px;display:none}
  #figures[data-open="true"]{display:block}
  table{border-collapse:collapse;width:100%;font-size:0.78rem}
  th,td{text-align:right;padding:4px 0 4px 12px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  thead th{
    font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--rule);
  }
  tbody td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  tbody td:first-child{font-family:inherit;color:var(--ink)}
  tbody tr:last-child td{border-top:1px solid var(--rule);padding-top:7px}
  #figures p{margin-top:11px;font-size:0.66rem;line-height:1.5;color:var(--ink-3)}

  #tooltip{
    position:fixed;z-index:5;pointer-events:none;opacity:0;
    transform:translate(-50%,-140%);
    background:var(--panel);border:1px solid var(--rule);border-radius:7px;
    padding:6px 10px;font-size:0.76rem;white-space:nowrap;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:opacity 0.12s;
  }
  #tooltip[data-on="true"]{opacity:1}
  #tooltip .tn{font-weight:500}
  #tooltip .th{color:var(--ink-2);font-size:0.72rem}

  #hint{display:none}

  #loading{
    position:fixed;inset:0;z-index:9;display:grid;place-items:center;
    background:var(--bg-bot);font-size:0.8rem;color:var(--ink-3);
    letter-spacing:0.1em;text-transform:uppercase;
  }
  #loading[hidden]{display:none}

  /* ---- narrow screens -------------------------------------------------- */
  /* The map keeps a full screen to itself; everything else moves below the
     fold. The network pills stay on the map -- switching must never need a
     scroll. */
  @media (max-width:820px){
    body{overflow:auto;overflow-x:hidden}
    #stage{position:relative;inset:auto;width:100%;height:100svh;height:100dvh}
    #meta,#figbtn{display:none}
    #nets,#regions{position:absolute}
    #nets{max-width:calc(100vw - 28px)}
    #nets button{padding:3px 8px;font-size:0.68rem}
    #dock{
      display:flex;flex-direction:column;gap:12px;
      padding:12px 12px 20px;
    }
    #legend,#controls,#figures{position:static;z-index:auto;max-width:none;min-width:0}
    #figures{display:block}
    #controls{flex-wrap:wrap;justify-content:space-between;padding:12px 14px}
    #profile{flex:1 1 140px;width:auto;min-width:0}
    #hint{
      display:block;position:absolute;left:0;right:0;bottom:10px;z-index:3;
      text-align:center;font-size:0.64rem;letter-spacing:0.14em;
      text-transform:uppercase;color:var(--ink-3);pointer-events:none;
    }
    #hint span{display:block;font-size:0.9rem;line-height:1;margin-top:2px}
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="map"></canvas>
  <canvas id="glow" hidden></canvas>
  <header>
    <div id="clock"><span class="hrs">--</span><span class="mins">:--</span></div>
    <div id="running">&nbsp;</div>
  </header>
  <nav id="nets" class="panel" aria-label="Network"></nav>
  <div id="regions" class="panel" role="group" aria-label="Region" hidden></div>
  <div id="meta"></div>
  <div id="hint">Scroll for legend and controls<span>&#8964;</span></div>
</div>

<button id="figbtn" class="panel" aria-expanded="false" aria-controls="figures">Figures</button>

<div id="dock">
  <div id="legend" class="panel">
    <h2>Train category</h2>
    <div id="legend-rows"></div>
    <footer id="legend-note"></footer>
  </div>
  <aside id="figures" class="panel" aria-label="Trains by category"></aside>
  <div id="controls" class="panel">
    <button id="play" aria-pressed="true">Pause</button>
    <div id="profile">
      <canvas id="profcv"></canvas>
      <input id="scrub" type="range" min="0" max="86399" step="60" value="0"
             aria-label="Time of day. The strip behind shows how many services begin at each hour.">
    </div>
    <div class="spd" role="group" aria-label="Playback speed">
      <button data-mps="4">1&times;</button>
      <button data-mps="8">2&times;</button>
      <button data-mps="16" aria-pressed="true">4&times;</button>
    </div>
    <div class="spd">
      <button id="resetview" hidden title="Back to the whole network">Reset view</button>
    </div>
    <div class="spd" id="bloomctl" data-on="false" aria-label="Glow">
      <button id="bloom" aria-pressed="false">Glow</button>
      <label title="Bloom diameter">&#8960;<input id="bloomd" type="range"
             min="2" max="24" step="1" value="6"></label>
      <label title="Bloom intensity">&#9728;<input id="bloomi" type="range"
             min="0.1" max="1" step="0.05" value="0.5"></label>
    </div>
  </div>
</div>

<div id="tooltip"><span class="tn"></span><br><span class="th"></span></div>
<div id="loading">Loading timetable</div>

<script>
(() => {
"use strict";

/* ====================================================================== */
/* Palette. The map is always night: a near-black ground so the trains are
   the only bright thing on screen. Hue roles are shared across networks;
   each network's classes point at a role. */
const PAL = {
  bgTop:"#05080e", bgBot:"#0a1018",
  land:"#121a26", landLine:"#1d2735", landEdge:"#35435a",
  ink:"#e9eff7", ink2:"#a7b3c4", ink3:"#78859a",
  rule:"#27333f", panel:"#0d141e",
  station:"#2b3849", hub:"#46586f",
  ice:"#5aa9ff", ic:"#ff7a45", reg:"#35d69a", night:"#ffd93d", tram:"#ff8fd8",
  /* Sixth hue, for Switzerland's rack railways and panorama expresses. */
  mtn:"#b98cff",
};
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const RGB = {};
for (const k in PAL) RGB[k] = hex2rgb(PAL[k]);
const pick = role => RGB[role];
const css  = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const DAY_SECONDS = 86400;

/* ====================================================================== */
/* Networks. Everything one dataset needs to become a page: where the data
   lives, how its classes look, where the map's furniture may sit, which
   cities get names. `views` holds one frame per region; only the US has
   more than one. */
const NETWORKS = {
  eu: {
    label:"Western Europe", pill:"Europe", unit:"trains",
    data:"data/eu-trains.json", geo:"data/eu-geo.json",
    minorPxPerDeg:120, borders:true,
    classes:{
      ice:       {label:"High-speed — ICE, TGV, Eurostar", cat:"high-speed",
                  role:"ice",   size:0.46, secs:600, trail:6, ring:1.00},
      intercity: {label:"Intercity — IC, EC, InterRegio", cat:"intercity",
                  role:"ic",    size:0.42, secs:560, trail:5, ring:0.70},
      /* 52,000 regional services is most of the map's cost and, at a frame
         1,300 km across, most of its texture: two trail segments read the
         same as four and cost half. */
      regional:  {label:"Regional — RE, RB, Sprinter, RER", cat:"regional",
                  role:"reg",   size:0.28, secs:260, trail:2, ring:0.08},
      mountain:  {label:"Rack railway and panorama", cat:"rack · panorama",
                  role:"mtn",   size:0.34, secs:420, trail:4, ring:0.40},
      night:     {label:"Night train", cat:"night",
                  role:"night", size:0.44, secs:600, trail:6, ring:1.00},
    },
    views:{ eu: {label:"Europe",
      core:{lon0:-5.10, lon1:15.40, lat0:42.30, lat1:55.30},
      maxv:{lon0:-7.00, lon1:18.40, lat0:41.00, lat1:56.60},
      clock:{lat:54.90, lon:6.20}} },
    cities:[
      ["Berlin",52.5251,13.3694,1],      ["Hamburg",53.5528,10.0067,1],
      ["München",48.1402,11.5600,1],     ["Köln",50.9430,6.9587,1,1],
      ["Frankfurt",50.1071,8.6638,1],    ["Amsterdam",52.3789,4.9003,1,1],
      ["Brussel",50.8360,4.3355,1,1],    ["Zürich",47.3782,8.5403,1],
      ["Paris",48.8767,2.3585,1,1],      ["Lyon",45.7602,4.8595,1,1],
      ["Marseille",43.3027,5.3804,0],    ["Bordeaux",44.8262,-0.5561,0,1],
      ["Toulouse",43.6114,1.4536,0],     ["Nantes",47.2172,-1.5423,0,1],
      ["Strasbourg",48.5850,7.7345,0],   ["Stuttgart",48.7838,9.1817,0],
      ["Hannover",52.3766,9.7411,0],     ["Leipzig",51.3453,12.3814,0],
      ["Dresden",51.0403,13.7323,0],     ["Nürnberg",49.4455,11.0821,0],
      ["Basel",47.5476,7.5896,0],        ["Bern",46.9490,7.4396,0,1],
      ["Genève",46.2102,6.1424,0,1],     ["Rotterdam",51.9249,4.4699,0,1],
      ["Antwerpen",51.2172,4.4210,0,1],  ["Luxembourg",49.6000,6.1342,0],
    ],
    meta: d => "<strong>" + d.trips.length + " scheduled trains</strong> over one " +
      d.weekday + " across Germany, the Benelux, Switzerland and France — " +
      "borders drawn, but not stopped at. " + dateStr(d) + ", except SNCF's " +
      "TER, TGV and Intercités, which are a 2025 timetable.",
    note: "Five countries on one map, so a EuroCity from Zürich to Hamburg " +
      "is one dot for its whole run instead of stopping at the border. " +
      "SNCF's own trains are drawn from an older timetable than everything " +
      "else, Paris included — see the data notes.",
    caveats: "Sources merged on the one Wednesday they cover: the " +
      "German DELFI dataset, OVapi/NDOV with SNCB and the Luxembourg feed " +
      "for the Benelux, the Swiss SKI+/SBB aggregate, Île-de-France " +
      "Mobilités for the RER and Transilien, and Eurostar's own " +
      "feed for the Paris and London legs. The shared date is what makes " +
      "the map honest — DELFI runs out on 13 June 2026 and Luxembourg's " +
      "feed starts on 6 May, so 10 June is the only window all four agree " +
      "on. France is the one exception and cannot be otherwise: the newest " +
      "openly mirrored SNCF timetable is from early 2025, with no overlap " +
      "at all with the 2026 windows of the others, so its trains run on " +
      "their own Wednesday, 5 February 2025, beside everyone else's June " +
      "2026. Two weekday timetables a year apart differ in detail, not in " +
      "character — but if you are counting French trains rather than " +
      "watching them, use the France map and read its notes. Paris is the " +
      "exception to the exception: the RER and Transilien come from " +
      "Île-de-France Mobilités, whose mirror does cover 10 June 2026, so the " +
      "Paris region runs on the same day as Germany. Trains are published by " +
      "both countries they run through — and SKI+ carries some 3,700 French " +
      "regional services that SNCF publishes as well — so services are " +
      "deduplicated across feeds: long distance on line, departure minute " +
      "and destination; regional on geography, since “S1” runs in half of " +
      "Europe and only the origin, the destination and the minute can tell " +
      "two regional trains apart. Germany's trains follow the route geometry in its feed " +
      "(simplified harder here than on the Germany map, because this is the " +
      "landing page); Benelux and Swiss trains interpolate straight between " +
      "stops, since neither feed publishes geometry. France, Austria, " +
      "Poland and Czechia are drawn as neighbours but carry no trains of " +
      "their own — services from the four feeds run off the frame toward " +
      "them. For the fullest version of any one country, use its own map.",
  },
  de: {
    label:"Germany", pill:"DE", unit:"trains",
    data:"data/trains.json", geo:"data/germany.json",
    minorPxPerDeg:0,
    classes:{
      ice:       {label:"High-speed — ICE, TGV, RJ", cat:"high-speed",
                  role:"ice",   size:0.50, secs:600, trail:6, ring:1.00},
      intercity: {label:"Intercity — IC, EC",         cat:"intercity",
                  role:"ic",    size:0.50, secs:600, trail:6, ring:1.00},
      regional:  {label:"Regional — RE, RB",          cat:"regional",
                  role:"reg",   size:0.30, secs:350, trail:3, ring:0.10},
      night:     {label:"Night train — NJ, EN",             cat:"night",
                  role:"night", size:0.43, secs:600, trail:6, ring:1.00},
    },
    views:{ de: {label:"Germany",
      core:{lon0:5.60, lon1:15.30, lat0:47.10, lat1:55.20},
      maxv:{lon0:3.00, lon1:19.20, lat0:45.20, lat1:56.30},
      clock:{lat:54.80, lon:12.55}} },
    cities:[
      ["Hamburg",53.5528,10.0064,1], ["Berlin",52.5251,13.3694,1],
      ["Bremen",53.0830,8.8139,1],   ["Hannover",52.3767,9.7410,1],
      ["Düsseldorf",51.2200,6.7929,1], ["Köln",50.9432,6.9586,1],
      ["Leipzig",51.3455,12.3811,1], ["Dresden",51.0400,13.7320,1],
      ["Frankfurt",50.1071,8.6638,1], ["Nürnberg",49.4456,11.0829,1],
      ["Stuttgart",48.7840,9.1817,1], ["München",48.1402,11.5601,1],
    ],
    meta: d => "<strong>" + d.trips.length + " scheduled trains</strong> over one " +
      d.weekday + " on the German rail network, drawn from published timetables for " +
      dateStr(d) + ".",
    note: "Urban transit (S-Bahn, U-Bahn, tram, bus) is excluded.",
    caveats: "Coverage is the complete official DELFI dataset, every operator " +
      "in all sixteen states, and each trip was verified stop-by-stop against " +
      "the raw feed. Trains follow the route geometry published in the feed " +
      "(simplified to ~200 m), so they take the real line, not straight " +
      "cuts between stations. Known weaknesses: position along the line is " +
      "still interpolated between timetabled stops; a few international " +
      "night trains are listed by two operators " +
      "(codeshares) and draw as one dot on top of another; and this is the " +
      "published schedule — no delays, no cancellations.",
  },
  nl: {
    label:"Benelux", pill:"BNL", unit:"trains",
    data:"data/nl-trains.json", geo:"data/nl-geo.json",
    minorPxPerDeg:100,
    classes:{
      ice:       {label:"High-speed — ICE, Eurostar, IC direct", cat:"high-speed",
                  role:"ice",   size:0.50, secs:600, trail:6, ring:1.00},
      intercity: {label:"Intercity",                  cat:"intercity",
                  role:"ic",    size:0.44, secs:500, trail:5, ring:0.50},
      regional:  {label:"Regional — Sprinter, stoptrein",       cat:"regional",
                  role:"reg",   size:0.32, secs:350, trail:3, ring:0.10},
      night:     {label:"Night train — Nightjet, European Sleeper", cat:"night",
                  role:"night", size:0.43, secs:600, trail:6, ring:1.00},
    },

    /* Central London packs six termini into four kilometres, so only the

    cities:[
      ["King's X",51.5308,-0.1238,1],      ["Waterloo",51.5031,-0.1132,1],

      ["Clapham Jn",51.4644,-0.1704,0,1],  ["Wimbledon",51.4214,-0.2064,0,1],

const dateStr = d => new Date(d.date+"T12:00:00Z").toLocaleDateString(
  "en-GB", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});

/* ====================================================================== */
/* Routing: #us, #us/chi, #tokyo ... Old single-page fragments still work. */
function parseHash(){
  const h = (location.hash || "").replace("#","");
  const [a, b] = h.split("/");
  if (NETWORKS[a]) return [a, NETWORKS[a].views[b] ? b : Object.keys(NETWORKS[a].views)[0]];
  if (NETWORKS.us.views[a]) return ["us", a];   /* legacy #chi etc. */
  /* The combined map is the front door: it is the one that shows trains
     crossing borders, which is the whole point of putting them together. */
  return ["eu", "eu"];
}
let [NETID, VIEWID] = parseHash();
let NET = NETWORKS[NETID];

/* ====================================================================== */
/* Per-network state, rebuilt by applyData() on every switch.              */
let DATA=null, GEO=null, CLASSES=[], CLASS_META={}, KEY_ROWS=[];
let ST=[], TRIPS=[], LABELS=[], SHAPES=null;
let RING_SCALE=[], DOT_SCALE=[];
let EVN=0, EVT=null, EVS=null, EVC=null, STARTS_MIN=null, PEAK=[];
let OCC=null;                        /* per-minute moving-train counts */

let CORE=null, MAXV=null, CLOCK_AT=null;
let VIEW=null, FRAME_ASPECT=1;
/* BASEVIEW is the frame the preset asked for; USERVIEW is where wheel and
   pinch have moved it, kept as centre + span so it survives a resize. */
let BASEVIEW=null, USERVIEW=null;

const cache = new Map();             /* url -> parsed JSON */
async function fetchJSON(url){
  if (cache.has(url)) return cache.get(url);
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ": " + r.status);
  const j = await r.json();
  cache.set(url, j);
  return j;
}

/* One time-scale rule for every network: the zoom decides the speed. A
   city-scale frame (under ~300 km across) runs at 2x, a national one at
   4x -- so trains cover pixels at a comparable, watchable rate whether the
   frame is Berlin or the whole US. The speed buttons still override. */
function viewMps(v){
  const mid = (v.core.lat0 + v.core.lat1) / 2;
  const spanKm = (v.core.lon1 - v.core.lon0) *
                 Math.cos(mid * Math.PI/180) * 111.32;
  return spanKm < 300 ? 8 : 16;
}
function setView(id){
  VIEWID = id;
  const v = NET.views[id];
  CORE = v.core; MAXV = v.maxv; CLOCK_AT = v.clock;
  /* A preset is a fresh start: whatever the wheel did to the last one does
     not carry over. Playback speed follows the preset's extent, not the
     live zoom, so going in for a closer look never changes the clock. */
  USERVIEW = null;
  /* Starting bloom values follow the zoom: a city frame has bigger marks
     and takes a wider, brighter glow. Hand-tuned values stay put. */
  if (!bloomTouched){
    [bloomD, bloomI] = viewMps(v) === 8 ? [10, 0.6] : [6, 0.5];
    const d = document.getElementById("bloomd"), i = document.getElementById("bloomi");
    if (d){ d.value = bloomD; i.value = bloomI; }
  }
  minutesPerSecond = viewMps(v);
  document.querySelectorAll(".spd button[data-mps]").forEach(o =>
    o.setAttribute("aria-pressed", String(+o.dataset.mps === minutesPerSecond)));
  updateZoomUI();
}

function applyData(data, geo){
  DATA = data; GEO = geo;
  CLASS_META = NET.classes;
  CLASSES = DATA.classes;
  /* One vocabulary across the maps: a high-speed train is a high-speed
     train whether the operator calls it ICE, TGV or Eurostar, so the key
     names the category and not the brand. City networks keep their own
     words -- there is no cross-border name for a U-Bahn. */
  KEY_ROWS = CLASSES.map(k => (CLASS_META[k] || {}).cat || k);
  RING_SCALE = CLASSES.map(k => (CLASS_META[k] || {}).ring ?? 1);
  DOT_SCALE  = CLASSES.map(k => (CLASS_META[k] || {}).size ?? 1);

  ST = DATA.stations.map(s => ({name:s[2], lon:s[0], lat:s[1], calls:0, x:0, y:0}));
  for (const tr of DATA.trips) for (const st of tr.s) ST[st[0]].calls++;
  /* Hubs are the top stations by calls, not an absolute cutoff. */
  {
    const sorted = ST.map(s=>s.calls).sort((a,b)=>b-a);
    const hubMin = sorted[Math.min(44, sorted.length-1)] || 1;
    for (const s of ST) s.hub = s.calls >= hubMin;
  }

  /* Times arrive in whole minutes; convert once, but never twice -- the
     JSON is cached and a revisit must not rescale it. */
  if (DATA.tunit === "min" && !DATA.__secs){
    for (const t of DATA.trips)
      for (const st of t.s){ st[1] *= 60; st[2] *= 60; }
    DATA.__secs = true;
  }
  TRIPS = DATA.trips.map(t => ({
    c:t.c, name:t.n, head:t.h, s:t.s, p:t.p || null,
    t0:t.s[0][1], t1:t.s[t.s.length-1][2],
  }));

  /* Route geometry (DE and Berlin ship it): decode the delta-encoded
     polylines once per dataset and keep them on the cached DATA object.
     Trains with a "p" entry travel along these instead of straight lines. */
  if (DATA.shapes && !DATA.__shapes){
    DATA.__shapes = DATA.shapes.map(flat => {
      const n = flat.length >> 1;
      const lon = new Float64Array(n), lat = new Float64Array(n);
      let x = 0, y = 0;
      for (let i = 0; i < n; i++){
        x += flat[2*i]; y += flat[2*i+1];
        lon[i] = x/1e4; lat[i] = y/1e4;
      }
      const cum = new Float32Array(n);
      const k = Math.cos(lat[0] * Math.PI/180);
      let L = 0;
      for (let i = 1; i < n; i++){
        L += Math.hypot((lon[i]-lon[i-1])*k, lat[i]-lat[i-1]);
        cum[i] = L;
      }
      if (L > 0) for (let i = 1; i < n; i++) cum[i] /= L;
      return {lon, lat, cum, px:new Float32Array(n), py:new Float32Array(n)};
    });
  }
  SHAPES = DATA.__shapes || null;

  LABELS = [];
  for (const [label, alat, alon, major, flip] of NET.cities){
    const k = Math.cos(alat*Math.PI/180);
    let best = null, bestD = Infinity;
    for (const s of ST){
      const d = ((s.lon-alon)*k)**2 + (s.lat-alat)**2;
      if (d < bestD){ bestD = d; best = s; }
    }
    if (best && bestD < (3/111.32)**2) LABELS.push({label, s:best, major, flip});
  }

  /* Origin events: rings on the map, bars in the profile strip. */
  EVN = TRIPS.length;
  EVT = new Int32Array(EVN); EVS = new Int32Array(EVN); EVC = new Uint8Array(EVN);
  STARTS_MIN = new Int32Array(1440);
  {
    const raw = TRIPS.map(t => [t.s[0][2] % DAY_SECONDS, t.s[0][0], t.c]);
    raw.sort((x,y) => x[0]-y[0]);
    raw.forEach((e,i) => {
      EVT[i]=e[0]; EVS[i]=e[1]; EVC[i]=e[2];
      STARTS_MIN[Math.floor(e[0]/60) % 1440]++;
    });
  }

  PEAK = (() => {
    const peak = CLASSES.map(()=>0), cur = CLASSES.map(()=>0), ev = [];
    for (const t of TRIPS){ ev.push([t.t0,1,t.c]); ev.push([t.t1,-1,t.c]); }
    ev.sort((a,b)=>a[0]-b[0]);
    for (const [,d,c] of ev){ cur[c]+=d; if (cur[c]>peak[c]) peak[c]=cur[c]; }
    return peak;
  })();

  /* Per-minute occupancy, folded over midnight: drives the overnight
     fast-forward on networks that sleep. */
  OCC = (() => {
    const delta = new Int32Array(2882);
    for (const t of TRIPS){
      const a = Math.max(0, Math.floor(t.t0/60));
      const b = Math.min(2879, Math.floor(t.t1/60));
      if (b >= a){ delta[a]++; delta[b+1]--; }
    }
    const run2 = new Int32Array(2880);
    for (let m = 0, run = 0; m < 2880; m++){ run += delta[m]; run2[m] = run; }
    const occ = new Int32Array(1440);
    for (let m = 0; m < 1440; m++) occ[m] = run2[m] + run2[m+1440];
    return occ;
  })();

  buildChrome();
}

function evLower(sec){
  let lo = 0, hi = EVN;
  while (lo < hi){ const m = (lo+hi) >> 1; if (EVT[m] < sec) lo = m+1; else hi = m; }
  return lo;
}

/* ====================================================================== */
/* Projection & layout                                                     */
function fitView(aspect){
  let {lon0, lon1, lat0, lat1} = CORE;
  const k = Math.cos(((lat0+lat1)/2) * Math.PI/180);
  const w = (lon1-lon0)*k, h = lat1-lat0;
  if (aspect > w/h){
    const extra = Math.min((aspect*h - w)/k, (MAXV.lon1-MAXV.lon0) - (lon1-lon0));
    lon0 -= extra/2; lon1 += extra/2;
  } else {
    const extra = Math.min(w/aspect - h, (MAXV.lat1-MAXV.lat0) - (lat1-lat0));
    lat0 -= extra/2; lat1 += extra/2;
  }
  VIEW = {lon0, lon1, lat0, lat1};
  const k2 = Math.cos(((lat0+lat1)/2) * Math.PI/180);
  FRAME_ASPECT = ((lon1-lon0)*k2) / (lat1-lat0);
}
const ux = lon => (lon-VIEW.lon0)/(VIEW.lon1-VIEW.lon0);
const uy = lat => (VIEW.lat1-lat)/(VIEW.lat1-VIEW.lat0);
/* The same projection against the preset frame. The clock and the key are
   anchored with these so they hold their place while the map zooms under
   them -- furniture belongs to the screen, not to the terrain. */
const uxBase = lon => { const v = BASEVIEW || VIEW;
  return (lon-v.lon0)/(v.lon1-v.lon0); };
const uyBase = lat => { const v = BASEVIEW || VIEW;
  return (v.lat1-lat)/(v.lat1-v.lat0); };

const stage = document.getElementById("stage");
const hdr = document.querySelector("header");
const prof = document.getElementById("profcv");
const profBase = document.createElement("canvas");
let profW = 0, profH = 0;
const cv = document.getElementById("map");
const ctx = cv.getContext("2d", {alpha:false});
let W=0, H=0, SX=0, SY=0, OX=0, OY=0, DPR=1;
let pathLand = null, pathStates = null;
const base = document.createElement("canvas");
let baseReady = false;
/* Bloom: the visible trains are drawn once more, tiny, into the #glow
   overlay; its CSS stretch back to full size is the blur, and the
   compositor's blend mode is the additive pass. Off by default, so the
   standard view and every video stay untouched. */
const glowSmall = document.getElementById("glow");
let bloomOn = false, bloomD = 6, bloomI = 0.5, bloomTouched = false;
let KEY_BOX = {x:0,y:0,w:0,h:0};
let CLOCK_BOX = {x:0,y:0,w:0,h:0};
/* placeClock measures the header, but at layout time the "N trains running"
   line may still be empty or belong to the previous network -- so the first
   chrome update after a layout re-places the clock at its true width. */
let clockDirty = true;
let PLACED = [];                      /* labels that survived collision */

function buildBasemap(){
  const ring = (path, r) => {
    path.moveTo(OX + ux(r[0][0])*SX, OY + uy(r[0][1])*SY);
    for (let i=1;i<r.length;i++) path.lineTo(OX + ux(r[i][0])*SX, OY + uy(r[i][1])*SY);
    path.closePath();
  };
  pathLand = new Path2D();
  for (const r of GEO.outline) ring(pathLand, r);
  pathStates = new Path2D();
  for (const r of GEO.states) ring(pathStates, r);
}

function resize(){
  if (!DATA) return;
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  W = stage.clientWidth; H = stage.clientHeight;
  if (!W || !H) return;
  DPR = dpr;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  baseReady = false;

  const narrow = window.matchMedia("(max-width:820px)").matches;
  const PAD = Math.min(W,H) * (narrow ? 0.012 : 0.03);
  const botBand = narrow ? 26 : 92;
  const availW = W - PAD*2;
  const availH = H - PAD*2 - botBand;
  fitView(availW/availH);
  let h = availH, w = h*FRAME_ASPECT;
  if (w > availW){ w = availW; h = w/FRAME_ASPECT; }
  SX = w; SY = h;
  OX = (W-w)/2;
  OY = PAD + (availH-h)*0.40;

  /* The frame the preset asked for. Zooming moves VIEW inside this
     rectangle; BASEVIEW stays put so the clock and key keep their place
     and so "how far in are we" has an answer. */
  BASEVIEW = {...VIEW};
  if (USERVIEW) applyUserView();

  reproject();
  sizeProfile();
  clockDirty = true;
}

/* Everything that turns the current VIEW into pixels. Cheap enough to run
   on every wheel tick: the projection is affine, so it is one multiply-add
   per coordinate. The canvas backing stores are deliberately not touched
   here -- only resize() reallocates them. */
function reproject(){
  for (const s of ST){ s.x = OX + ux(s.lon)*SX; s.y = OY + uy(s.lat)*SY; }
  if (SHAPES) for (const sh of SHAPES){
    const {lon, lat, px, py} = sh;
    for (let i = 0; i < lon.length; i++){
      px[i] = OX + ux(lon[i])*SX;
      py[i] = OY + uy(lat[i])*SY;
    }
  }
  buildBasemap();
  renderBase();
  placeClock();
  placeKey();
  placeLabels();
}

/* ---------------------------------------------------------------------- */
/* Zoom and pan. VIEW is the live window; USERVIEW remembers where the user
   put it as centre + longitude span, so a container resize or an orientation
   change keeps their frame instead of snapping back to the preset. */

const MAX_ZOOM = 40;
const zoomNow = () => !BASEVIEW ? 1
  : (BASEVIEW.lon1-BASEVIEW.lon0) / (VIEW.lon1-VIEW.lon0);
/* Inverse of ux/uy: which coordinate is under this pixel. */
const lonAt = px => VIEW.lon0 + ((px-OX)/SX)*(VIEW.lon1-VIEW.lon0);
const latAt = py => VIEW.lat1 - ((py-OY)/SY)*(VIEW.lat1-VIEW.lat0);

function applyUserView(){
  /* Latitude span follows from the frame's aspect, so the map never
     stretches however the user got here. */
  const {lonC, latC, spanLon} = USERVIEW;
  const k = Math.cos(latC * Math.PI/180);
  const spanLat = (spanLon * k) / (SX/SY);
  VIEW = {lon0: lonC - spanLon/2, lon1: lonC + spanLon/2,
          lat0: latC - spanLat/2, lat1: latC + spanLat/2};
}

function setUserView(lonC, latC, spanLon){
  const baseSpan = BASEVIEW.lon1 - BASEVIEW.lon0;
  spanLon = Math.min(baseSpan, Math.max(baseSpan/MAX_ZOOM, spanLon));
  /* Keep the centre inside the preset frame: panning may look around the
     network, not wander off into empty ocean. */
  lonC = Math.min(BASEVIEW.lon1, Math.max(BASEVIEW.lon0, lonC));
  latC = Math.min(BASEVIEW.lat1, Math.max(BASEVIEW.lat0, latC));
  /* Pinching back out lands near the preset rather than exactly on it, so
     anything within half a percent counts as "all the way out" and the
     reset button retires itself. */
  const back = spanLon > baseSpan*0.995 &&
    Math.abs(lonC - (BASEVIEW.lon0+BASEVIEW.lon1)/2) < baseSpan*0.02 &&
    Math.abs(latC - (BASEVIEW.lat0+BASEVIEW.lat1)/2) < baseSpan*0.02;
  USERVIEW = back ? null : {lonC, latC, spanLon};
  if (USERVIEW) applyUserView(); else VIEW = {...BASEVIEW};
  reproject();
  updateZoomUI();
  /* The counts say how many trains are visible, so they have to be redone
     when the view changes -- otherwise a paused map keeps the old number. */
  lastMinute = -1;
}

/* Zoom about a pixel, keeping whatever is under it exactly there. */
function zoomAt(px, py, factor){
  if (!BASEVIEW) return;
  const lon = lonAt(px), lat = latAt(py);
  const baseSpan = BASEVIEW.lon1 - BASEVIEW.lon0;
  const span = Math.min(baseSpan, Math.max(baseSpan/MAX_ZOOM,
                                           (VIEW.lon1-VIEW.lon0) / factor));
  const k = Math.cos(lat * Math.PI/180);
  const spanLat = (span * k) / (SX/SY);
  /* Solve for the centre that leaves (lon,lat) under (px,py). */
  const fx = (px-OX)/SX, fy = (py-OY)/SY;
  setUserView(lon - (fx - 0.5)*span, lat + (fy - 0.5)*spanLat, span);
}

/* Absolute pinch: put the coordinate that started under the midpoint back
   under wherever the midpoint is now, at the span the spread asks for. */
function pinchTo(now, start){
  const baseSpan = BASEVIEW.lon1 - BASEVIEW.lon0;
  const span = Math.min(baseSpan, Math.max(baseSpan/MAX_ZOOM,
                                           start.span / (now.d / start.d)));
  const k = Math.cos(start.lat * Math.PI/180);
  const spanLat = (span * k) / (SX/SY);
  const fx = (now.mx-OX)/SX, fy = (now.my-OY)/SY;
  setUserView(start.lon - (fx - 0.5)*span, start.lat + (fy - 0.5)*spanLat, span);
}

function panByPixels(dx, dy){
  if (!VIEW) return;
  const dLon = (dx/SX) * (VIEW.lon1-VIEW.lon0);
  const dLat = (dy/SY) * (VIEW.lat1-VIEW.lat0);
  setUserView((VIEW.lon0+VIEW.lon1)/2 - dLon,
              (VIEW.lat0+VIEW.lat1)/2 + dLat,
              VIEW.lon1-VIEW.lon0);
}

function resetView(){
  USERVIEW = null;
  if (BASEVIEW){ VIEW = {...BASEVIEW}; reproject(); }
  updateZoomUI();
  lastMinute = -1;
}

function updateZoomUI(){
  const b = document.getElementById("resetview");
  if (!b) return;
  b.hidden = !USERVIEW;
  /* The factor doubles as a scale cue: it is the only thing on screen that
     says how far in you are. */
  if (USERVIEW){
    const z = zoomNow();
    b.textContent = "Reset " + (z < 9.95 ? z.toFixed(1) : Math.round(z)) + "×";
  }
}

function placeClock(){
  const box = hdr.getBoundingClientRect();
  const hw = box.width/2 || 60, hh = box.height/2 || 24;
  /* On a portrait screen a wide network is a band across the middle with
     empty sky above -- put the clock there rather than on the map. */
  let x = OX + uxBase(CLOCK_AT.lon)*SX, y = OY + uyBase(CLOCK_AT.lat)*SY;
  if (SY < H*0.55){ x = W/2; y = OY - hh - 12; }
  x = Math.max(hw+8, Math.min(W-hw-8, x));
  y = Math.max(hh+8, Math.min(H-hh-8, y));
  hdr.style.left = x + "px";
  hdr.style.top  = y + "px";
  /* Labels are placed once, but the header keeps growing all day as the
     running count gains digits -- 99 trains at dawn, 1,700 at five. Reserve
     a cushion so a label parked beside the clock at midnight is not covered
     by a wider number at rush hour. */
  const PAD_X = 26, PAD_Y = 4;
  CLOCK_BOX = {x:x-hw-PAD_X, y:y-hh-PAD_Y, w:hw*2+PAD_X*2, h:hh*2+PAD_Y*2};
}

/* The key sits in the bottom-right corner and stays there. It used to be
   anchored to a coordinate, which put it in a different place on every map
   and moved it when you zoomed; a legend that wanders is one more thing to
   look for. On a portrait screen the map is a band across the middle, so it
   goes under the frame instead of over it. */
function placeKey(){
  const ROW = 14, PADX = 8, PADY = 6, DOT = 3;
  ctx.font = '500 10px "IBM Plex Mono",monospace';
  let textW = 0;
  for (const r of KEY_ROWS) textW = Math.max(textW, ctx.measureText(r).width);
  const boxW = PADX*2 + DOT*2 + 7 + textW, boxH = PADY*2 + ROW*KEY_ROWS.length;
  /* Bottom-right of the window, lifted clear of whatever the play controls
     occupy -- measured rather than guessed, because that panel changes
     height with the day-profile strip. */
  const M = 14;
  const ctl = document.getElementById("controls");
  const cb = ctl ? ctl.getBoundingClientRect() : null;
  /* offsetParent is null for a fixed panel, so measure the rectangle and
     ask whether it has a height instead of whether it is laid out. */
  const floor = cb && cb.height > 0 && cb.top > 0 && cb.top < H ? cb.top : H;
  let x = W - boxW - M;
  let y = floor - boxH - M;
  if (SY < H*0.55){ x = W/2 - boxW/2; y = OY + SY + 12; }
  x = Math.max(6, Math.min(W - boxW - 6, x));
  y = Math.max(6, Math.min(H - boxH - 6, y));
  KEY_BOX = {x, y, w:boxW, h:boxH, ROW, PADX, PADY, DOT};
}

/* City labels are placed once per layout, not per frame: majors first, then
   minors, each trying its preferred side, the flipped side and a downward
   slot before giving up. Nothing may cover the clock, the key or an
   already-placed label -- that is the no-overlap guarantee. */
function placeLabels(){
  PLACED = [];
  ctx.font = '400 11px "IBM Plex Sans",system-ui,sans-serif';
  const pxPerDeg = SX / (VIEW.lon1 - VIEW.lon0);
  const withMinors = pxPerDeg >= NET.minorPxPerDeg;
  const taken = [CLOCK_BOX, KEY_BOX];
  const hits = (r) =>
    r.x < 2 || r.y < 2 || r.x + r.w > W-2 ||
    taken.some(t => r.x < t.x+t.w && r.x+r.w > t.x && r.y < t.y+t.h && r.y+r.h > t.y);
  const order = [...LABELS.filter(L=>L.major), ...(withMinors ? LABELS.filter(L=>!L.major) : [])];
  for (const L of order){
    const tw = ctx.measureText(L.label).width;
    /* Four vertical slots, both sides: enough room for the termini that
       crowd a city centre to find their own line. Nothing is force-placed
       -- an unlabelled dot reads better than two names printed over each
       other, which is what a portrait frame used to do to London. */
    const sides = L.flip ? [L.flip] : [1, -1];
    let done = false;
    for (const dy of [-6, 12, -19, 25]){
      for (const side of sides){
        const x = side > 0 ? L.s.x + 6 : L.s.x - 6 - tw;
        const r = {x, y: L.s.y + dy - 11, w: tw, h: 13};
        if (!hits(r)){
          PLACED.push({...L, side, dy, r});
          taken.push(r);
          done = true; break;
        }
      }
      if (done) break;
    }
  }
}

function renderBase(){
  base.width = cv.width; base.height = cv.height;
  const b = base.getContext("2d", {alpha:false});
  b.setTransform(DPR,0,0,DPR,0,0);
  const g = b.createLinearGradient(0,0,0,H);
  g.addColorStop(0, css(pick("bgTop")));
  g.addColorStop(1, css(pick("bgBot")));
  b.fillStyle = g;
  b.fillRect(0,0,W,H);
  /* Map features are terrain, so they thicken as you go in -- a coastline
     held at 1.1 px looks like thread at 20x. Damped, and capped, so the
     country outline never turns into a border wall. */
  const mz = Math.min(2.4, Math.sqrt(zoomNow()));
  if (pathLand){
    b.fillStyle = css(pick("land"));
    b.fill(pathLand, "evenodd");
    b.lineJoin = "round";
    b.strokeStyle = rgba(pick("landLine"), 0.9);
    b.lineWidth = 0.8 * mz;
    b.stroke(pathStates);
    /* On a map that spans several countries the national borders are worth
       reading -- they are what the trains are crossing -- so the outline
       layer gets a touch more ink there than on a single-country map. */
    const multi = !!NET.borders;
    b.strokeStyle = rgba(pick("landEdge"), multi ? 1 : 0.85);
    b.lineWidth = (multi ? 1.5 : 1.1) * mz;
    b.stroke(pathLand);
  }
  /* Stations are the substrate, not the subject, so they are sized against
     the trains rather than against the map. They used to grow with the
     basemap ink, which is right for a coastline and wrong here: train dots
     are a fixed size on purpose, so by full zoom a country halt outweighed
     the ICE passing through it. Now they are a fraction of the largest dot
     the network draws, and a little more opaque to make up for the size. */
  const rBig  = DOT_R * Math.max(...DOT_SCALE);
  const rHub  = Math.min(1.7 * mz, rBig * 0.75);
  const rStop = Math.min(0.9 * mz, rBig * 0.42);
  const cSt = pick("station"), cHub = pick("hub");
  for (const s of ST){
    if (s.x < -30 || s.x > W+30 || s.y < -30 || s.y > H+30) continue;
    b.beginPath();
    b.arc(s.x, s.y, s.hub ? rHub : rStop, 0, 6.2832);
    b.fillStyle = rgba(s.hub ? cHub : cSt, s.hub ? 0.95 : 0.62);
    b.fill();
  }
  baseReady = true;
}

function sizeProfile(){
  const r = prof.getBoundingClientRect();
  if (!r.width || !r.height || !STARTS_MIN) return;
  profW = r.width; profH = r.height;
  prof.width = Math.round(r.width*DPR); prof.height = Math.round(r.height*DPR);
  profBase.width = prof.width; profBase.height = prof.height;

  const c = profBase.getContext("2d");
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,profW,profH);

  const GUT = 26;
  const plotW = Math.max(20, profW - GUT);
  const baseY = profH - 10;
  const arm = baseY - 3;
  const bins = Math.max(48, Math.min(240, Math.floor(plotW)));
  const per = 1440/bins;
  const up = new Float64Array(bins);
  for (let m = 0; m < 1440; m++)
    up[Math.min(bins-1, Math.floor(m/per))] += STARTS_MIN[m];
  let peak = 1;
  for (let b = 0; b < bins; b++) peak = Math.max(peak, up[b]);

  const bw = plotW/bins;
  c.fillStyle = rgba(pick("ink2"), 0.85);
  for (let b = 0; b < bins; b++){
    const hgt = (up[b]/peak) * arm;
    if (hgt < 0.4) continue;
    c.fillRect(GUT + b*bw, baseY-hgt, Math.max(0.7, bw-0.6), hgt);
  }
  c.fillStyle = rgba(pick("ink3"), 0.5);
  c.fillRect(GUT, baseY, plotW, 1);
  c.font = '500 8px "IBM Plex Mono",monospace';
  c.textAlign = "center";
  for (const hr of [6,12,18]){
    const x = GUT + (hr/24)*plotW;
    c.fillStyle = rgba(pick("ink3"), 0.28);
    c.fillRect(x-0.5, 2, 1, baseY-2);
    c.fillStyle = rgba(pick("ink3"), 0.8);
    c.textBaseline = "bottom";
    c.fillText(String(hr).padStart(2,"0"), x, profH);
  }
  c.textAlign = "left";
  c.textBaseline = "bottom";
  c.fillStyle = rgba(pick("ink3"), 0.95);
  c.fillText("start", 0, baseY);
}

/* ====================================================================== */
function posAt(t, sec){
  const s = t.s;
  if (sec < t.t0 || sec > t.t1) return null;
  let lo = 0, hi = s.length-1;
  while (lo < hi){
    const mid = (lo+hi+1) >> 1;
    if (s[mid][1] <= sec) lo = mid; else hi = mid-1;
  }
  const a = s[lo];
  const P = t.p;
  if (lo === s.length-1 || sec <= a[2]){
    if (P) return shapePoint(P[0], P[1][lo]);
    const st = ST[a[0]];
    return [st.x, st.y];
  }
  const b = s[lo+1];
  const span = b[1] - a[2];
  const f = span > 0 ? (sec - a[2]) / span : 0;
  if (P){
    const fr = P[1];
    return shapePoint(P[0], fr[lo] + (fr[lo+1]-fr[lo])*f);
  }
  const p = ST[a[0]], q = ST[b[0]];
  return [p.x + (q.x-p.x)*f, p.y + (q.y-p.y)*f];
}

/* Position along a decoded shape at fraction fm (per-mille of its length). */
function shapePoint(si, fm){
  const sh = SHAPES[si], cum = sh.cum, n = cum.length;
  const f = fm / 1000;
  let lo = 0, hi = n-1;
  while (lo < hi){
    const m = (lo+hi+1) >> 1;
    if (cum[m] <= f) lo = m; else hi = m-1;
  }
  if (lo >= n-1) return [sh.px[n-1], sh.py[n-1]];
  const span = cum[lo+1] - cum[lo];
  const u = span > 0 ? (f - cum[lo]) / span : 0;
  return [sh.px[lo] + (sh.px[lo+1]-sh.px[lo])*u,
          sh.py[lo] + (sh.py[lo+1]-sh.py[lo])*u];
}

/* ====================================================================== */
/* Every network's day starts at midnight. */
let simSec = 0;
let minutesPerSecond = 16;
let playing = true;
let lastFrame = performance.now();
let ffwd = false;

const pulseSpan = () => Math.max(180, Math.min(960, minutesPerSecond*60*0.65));
const DOT_R = 1.8;
let hitList = [];

function draw(){
  const bgBot = pick("bgBot"), cInk3 = pick("ink3");
  const hues  = CLASSES.map(k => pick(CLASS_META[k].role));

  if (!baseReady) renderBase();
  ctx.drawImage(base, 0, 0, W, H);

  hitList = [];
  const g = ctx;
  for (const t of TRIPS){
    const meta = CLASS_META[CLASSES[t.c]] || {size:1};
    for (const off of (t.t1 > DAY_SECONDS ? [0, DAY_SECONDS] : [0])){
      const sec = simSec + off;
      const head = posAt(t, sec);
      if (!head) continue;
      if (head[0] < -60 || head[0] > W+60 || head[1] < -60 || head[1] > H+60) continue;

      const col = hues[t.c], scale = meta.size;
      const steps = meta.trail || 7;
      const span = meta.secs || 1200;
      let px = head[0], py = head[1];
      for (let k = 1; k <= steps; k++){
        const back = posAt(t, sec - (span/steps)*k);
        if (!back) break;
        const a = (1 - k/steps) * 0.55;
        if (a <= 0.02) break;
        g.beginPath();
        g.moveTo(px, py);
        g.lineTo(back[0], back[1]);
        g.strokeStyle = rgba(col, a);
        g.lineWidth = Math.max(1/DPR, 2.4 * scale * (1 - k/(steps+3)));
        g.lineCap = "round";
        g.stroke();
        px = back[0]; py = back[1];
      }

      /* The halo is a 15%-opacity disc; below about a pixel and a half it
         is invisible, and on a map with fifty thousand regional services
         those are thousands of arcs a frame spent on nothing. */
      if (3.6*scale*DPR >= 1.5){
        g.beginPath();
        g.arc(head[0], head[1], 3.6*scale, 0, 6.2832);
        g.fillStyle = rgba(col, 0.15);
        g.fill();
      }

      const rDev = DOT_R*scale*DPR;
      if (rDev < 1.3){
        const side = Math.max(1, Math.round(rDev*2));
        g.fillStyle = rgba(col, 1);
        g.fillRect(Math.round(head[0]*DPR - side/2)/DPR,
                     Math.round(head[1]*DPR - side/2)/DPR,
                     side/DPR, side/DPR);
      } else {
        g.beginPath();
        g.arc(head[0], head[1], DOT_R*scale, 0, 6.2832);
        g.fillStyle = rgba(col, 0.98);
        g.fill();
      }
      hitList.push([head[0], head[1], t]);
    }
  }

  /* origin rings */
  {
    const span = pulseSpan();
    const from = simSec - span;
    let i = evLower(from < 0 ? 0 : from);
    const visit = (idx) => {
      let age = simSec - EVT[idx];
      if (age < 0) age += DAY_SECONDS;
      const f = age/span;
      if (f < 0 || f >= 1) return;
      const st = ST[EVS[idx]];
      if (st.x < -20 || st.x > W+20 || st.y < -20 || st.y > H+20) return;
      const cls = EVC[idx];
      const r = DOT_R*DOT_SCALE[cls] + 1.1 + f * 7 * RING_SCALE[cls];
      g.beginPath();
      g.arc(st.x, st.y, r, 0, 6.2832);
      g.strokeStyle = rgba(hues[cls], (1-f) * 0.5);
      g.lineWidth = Math.max(1/DPR, 1.2);
      g.stroke();
    };
    for (; i < EVN && EVT[i] <= simSec; i++) visit(i);
    if (from < 0){
      const wrap = DAY_SECONDS + from;
      for (let j = evLower(wrap); j < EVN; j++) visit(j);
    }
  }
  /* Glow: replay the dots just drawn (hitList already holds every visible
     train) into the small overlay. Dots only -- trails and rings stay
     crisp. */
  if (bloomOn){
    const k = Math.max(2, Math.round(bloomD / 2));
    const sw = Math.max(2, Math.round(W / k));
    const sh = Math.max(2, Math.round(H / k));
    if (glowSmall.width !== sw || glowSmall.height !== sh){
      glowSmall.width = sw; glowSmall.height = sh;
    }
    const gs = glowSmall.getContext("2d");
    gs.setTransform(1,0,0,1,0,0);
    gs.clearRect(0, 0, sw, sh);
    gs.setTransform(sw/W, 0, 0, sh/H, 0, 0);
    for (const [hx, hy, t] of hitList){
      const scale = (CLASS_META[CLASSES[t.c]] || {size:1}).size;
      gs.beginPath();
      gs.arc(hx, hy, 3.6*scale, 0, 6.2832);
      gs.fillStyle = rgba(hues[t.c], 0.15);
      gs.fill();
      gs.beginPath();
      gs.arc(hx, hy, DOT_R*scale, 0, 6.2832);
      gs.fillStyle = rgba(hues[t.c], 0.98);
      gs.fill();
    }
    glowSmall.style.opacity = bloomI;
  }

  if (profW){
    const c = prof.getContext("2d");
    c.setTransform(1,0,0,1,0,0);
    c.clearRect(0,0,prof.width,prof.height);
    c.drawImage(profBase, 0, 0);
  }

  drawKey(hues, bgBot);

  /* city names, pre-placed with no overlaps */
  ctx.font = '400 11px "IBM Plex Sans",system-ui,sans-serif';
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.lineWidth = 3;
  ctx.strokeStyle = rgba(bgBot, 0.85);
  for (const L of PLACED){
    ctx.textAlign = L.side > 0 ? "left" : "right";
    ctx.strokeText(L.label, L.side > 0 ? L.s.x + 6 : L.s.x - 6, L.s.y + L.dy);
  }
  ctx.fillStyle = rgba(cInk3, 0.95);
  for (const L of PLACED){
    ctx.textAlign = L.side > 0 ? "left" : "right";
    ctx.fillText(L.label, L.side > 0 ? L.s.x + 6 : L.s.x - 6, L.s.y + L.dy);
  }
  ctx.textAlign = "left";

  updateChrome();
}

function drawKey(hues, bgBot){
  const {x, y, w, h, ROW, PADX, PADY, DOT} = KEY_BOX;
  ctx.font = '500 10px "IBM Plex Mono",monospace';
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 5);
  ctx.fillStyle = rgba(bgBot, 0.62);
  ctx.fill();
  ctx.strokeStyle = rgba(pick("rule"), 0.55);
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  KEY_ROWS.forEach((r, i) => {
    const cy = y + PADY + ROW*i + ROW/2;
    ctx.beginPath();
    ctx.arc(x + PADX + DOT, cy, DOT, 0, 6.2832);
    ctx.fillStyle = rgba(hues[i], 1);
    ctx.fill();
    ctx.fillStyle = rgba(pick("ink2"), 0.95);
    ctx.fillText(r, x + PADX + DOT*2 + 7, cy);
  });
}

let lastMinute = -1;

function updateChrome(){
  const mins = Math.floor(simSec/60);
  if (mins === lastMinute) return;
  lastMinute = mins;
  elHrs.textContent = pad2(Math.floor(mins/60) % 24);
  elMins.textContent = ":" + pad2(mins % 60);
  elScrub.value = simSec;
  elRunning.setAttribute("data-ffwd", String(ffwd));
  const counts = CLASSES.map(()=>0);
  for (const [x,y,t] of hitList)
    if (x >= 0 && x <= W && y >= 0 && y <= H) counts[t.c]++;
  let total = 0;
  counts.forEach((c,i) => {
    total += c;
    const el = document.getElementById("lg-count-"+i);
    if (el) el.textContent = c;
  });
  elRunning.textContent = total + " " + (total === 1
    ? NET.unit.replace(/s$/,"") : NET.unit) + " running";
  if (clockDirty){
    clockDirty = false;
    placeClock();
    placeLabels();
  }
}

function buildChrome(){
  const rows = document.getElementById("legend-rows");
  rows.innerHTML = "";
  const maxSize = Math.max(...CLASSES.map(k => (CLASS_META[k]||{size:1}).size));
  CLASSES.forEach((k,i) => {
    const meta = CLASS_META[k] || {label:k, role:"night", size:1};
    const d = Math.max(5, Math.round(12*meta.size/maxSize));
    rows.insertAdjacentHTML("beforeend",
      '<div class="lg"><span class="sw" style="background:var(--'+meta.role+
      ');width:'+d+'px;height:'+d+'px;margin:0 '+((12-d)/2)+'px"></span>'+
      '<span class="nm">'+meta.label+'</span>'+
      '<span class="ct" id="lg-count-'+i+'">0</span></div>');
  });
  const scopeNote = DATA.note
    ? " " + DATA.note.split(" — ")[0].replace(/\.\s*$/,"") + "."
    : "";
  document.getElementById("legend-note").textContent =
    "Count = " + NET.unit + " moving inside the frame at this minute. Dot size " +
    "follows category. A ring opens where a service begins; the strip by the " +
    "scrubber counts those starts across the day. " + NET.note + scopeNote +
    " Data notes and known gaps: see the Figures panel.";

  document.getElementById("meta").innerHTML = NET.meta(DATA);

  const fig = document.getElementById("figures");
  const frows = CLASSES.map((k,i) =>
    "<tr><td>" + (CLASS_META[k]||{label:k}).label + "</td><td>" +
    (DATA.counts[k]||0) + "</td><td>" + PEAK[i] + "</td></tr>").join("");
  const total = CLASSES.reduce((a,k)=>a+(DATA.counts[k]||0), 0);
  fig.innerHTML =
    "<h2>" + NET.label + " by category</h2>" +
    "<table><thead><tr><th>Category</th><th>Trips</th><th>Peak</th></tr></thead><tbody>" +
    frows + "<tr><td>All categories</td><td>" + total + "</td><td>&mdash;</td></tr>" +
    "</tbody></table><p>Trips = distinct scheduled services on the day. Peak = " +
    "the most of that category moving at once." +
    (DATA.note ? " " + DATA.note : "") + " Source: " + DATA.source + ".</p>" +
    (NET.caveats ? "<h2 style=\"margin-top:14px\">Data notes &amp; gaps</h2><p style=\"margin-top:4px\">" +
      NET.caveats + "</p>" : "");

  /* region row only where a network has more than one view */
  const holder = document.getElementById("regions");
  holder.innerHTML = "";
  const views = Object.entries(NET.views);
  holder.hidden = views.length < 2;
  if (holder.hidden) document.body.removeAttribute("data-regions");
  else document.body.setAttribute("data-regions", "");
  /* The pill row wraps to two lines on a phone, so the region row cannot
     sit at a fixed offset: park it under whatever height the pills took. */
  if (!holder.hidden){
    const nets = document.getElementById("nets");
    holder.style.top = (nets.offsetTop + nets.offsetHeight + 4) + "px";
  }
  for (const [id, v] of views){
    const b = document.createElement("button");
    b.textContent = v.label;
    b.setAttribute("aria-pressed", String(id === VIEWID));
    b.addEventListener("click", () => {
      if (id === VIEWID) return;
      setView(id);
      writeHash();
      holder.querySelectorAll("button").forEach((o,i) =>
        o.setAttribute("aria-pressed", String(views[i][0] === id)));
      resize();
    });
    holder.appendChild(b);
  }
}

function writeHash(){
  const first = Object.keys(NET.views)[0];
  history.replaceState(null, "",
    "#" + NETID + (VIEWID === first ? "" : "/" + VIEWID));
}

/* ====================================================================== */
/* Network switching                                                        */
const netsEl = document.getElementById("nets");
for (const [id, n] of Object.entries(NETWORKS)){
  const b = document.createElement("button");
  b.textContent = n.pill;
  b.dataset.net = id;
  b.setAttribute("aria-pressed", String(id === NETID));
  b.addEventListener("click", () => switchNetwork(id));
  netsEl.appendChild(b);
}

async function switchNetwork(id, viewId){
  if (!NETWORKS[id]) return;
  if (id === NETID && DATA) return;
  NETID = id; NET = NETWORKS[id];
  netsEl.querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.net === id)));
  setView(NET.views[viewId] ? viewId : Object.keys(NET.views)[0]);
  writeHash();
  const loading = document.getElementById("loading");
  loading.hidden = false;
  try {
    const [data, geo] = await Promise.all([fetchJSON(NET.data), fetchJSON(NET.geo)]);
    if (NETID !== id) return;          /* user clicked away mid-load */
    applyData(data, geo);
    simSec = 0;                        /* every day starts at midnight */
    lastMinute = -1;
    resize();
    if (data.defer) loadDeferred(id, data);
  } catch (e){
    document.getElementById("legend-note").textContent =
      "Could not load " + NET.data + " — " + e.message +
      ". This page fetches its data, so it needs http(s), not file://.";
  }
  loading.hidden = true;
}

/* The biggest map ships in two pieces: the long-distance spine paints at
   once, the regional bulk -- twenty times the trains, most of the bytes --
   follows and is merged in. Nothing is left out; the small trains simply
   arrive a second later, which is the difference between a map that is
   there and a map you wait for. */
async function loadDeferred(id, core){
  let extra;
  try {
    extra = await fetchJSON(NET.data.replace(/[^/]+$/, core.defer));
  } catch (e){ return; }             /* the core map stands on its own */
  if (NETID !== id || DATA !== core) return;

  /* The second file's station and shape indices already continue where the
     core's stop, so merging really is two concatenations -- offsetting them
     here again would send every regional train off the end of the list. */
  if (extra.shapes) core.shapes = (core.shapes || []).concat(extra.shapes);
  core.stations = core.stations.concat(extra.stations);
  /* applyData converted the core's times once and marked the object; these
     rows have not been through that, so convert them here rather than
     letting a second pass double the whole dataset. */
  const toSec = core.__secs && extra.tunit === "min";
  if (toSec) for (const t of extra.trips)
    for (const s of t.s){ s[1] *= 60; s[2] *= 60; }
  core.trips = core.trips.concat(extra.trips);
  core.counts = Object.assign({}, core.countsAll || core.counts);
  delete core.defer;
  delete core.__shapes;              /* shape list grew; decode it again */

  applyData(core, GEO);
  resize();
  lastMinute = -1;
}

window.addEventListener("hashchange", () => {
  const [n, v] = parseHash();
  if (n !== NETID) switchNetwork(n, v);
  else if (v !== VIEWID){ setView(v); resize(); buildChrome(); }
});

    holder.setAttribute("data-on", String(bloomOn));
    glowSmall.hidden = !bloomOn;
  });
  document.getElementById("bloomd").addEventListener("input", e => {
    bloomD = +e.target.value; bloomTouched = true;
  });
  document.getElementById("bloomi").addEventListener("input", e => {
    bloomI = +e.target.value; bloomTouched = true;
  });
}
window.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "INPUT"){ e.preventDefault(); playBtn.click(); }
});

/* ---------------------------------------------------------------------- */
/* Wheel zooms about the cursor; a mouse drag pans. On touch the map only
   answers to two fingers -- pinch to zoom, move them together to pan --
   because one finger still has to scroll the page to the controls. */
{
  const pts = new Map();          /* live pointers, id -> {x, y, touch} */
  let dragging = false, moved = 0, last = null, pinch = null;
  const spanOf = () => {
    const [a, b] = [...pts.values()];
    return {d: Math.hypot(a.x-b.x, a.y-b.y),
            mx: (a.x+b.x)/2, my: (a.y+b.y)/2};
  };

  cv.addEventListener("wheel", e => {
    if (!BASEVIEW) return;
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    /* deltaMode 1 is lines, 2 is pages; normalise to something pixel-ish. */
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 100 : 1;
    zoomAt(e.clientX - r.left, e.clientY - r.top,
           Math.exp(-e.deltaY * unit * 0.0011));
  }, {passive:false});

  cv.addEventListener("pointerdown", e => {
    const r = cv.getBoundingClientRect();
    pts.set(e.pointerId, {x:e.clientX-r.left, y:e.clientY-r.top,
                          touch:e.pointerType !== "mouse"});
    if (pts.size === 2){
      const s = spanOf();
      /* Remember the whole starting state, including which coordinate sat
         under the midpoint -- that point stays pinned between the fingers. */
      pinch = {d:s.d, mx:s.mx, my:s.my,
               span: VIEW.lon1 - VIEW.lon0,
               lon: lonAt(s.mx), lat: latAt(s.my)};
      dragging = false;
      cv.setPointerCapture(e.pointerId);
    } else if (pts.size === 1 && e.pointerType === "mouse"){
      dragging = true; moved = 0;
      last = {x:e.clientX-r.left, y:e.clientY-r.top};
      cv.setPointerCapture(e.pointerId);
    }
  });

  cv.addEventListener("pointermove", e => {
    const p = pts.get(e.pointerId);
    if (!p) return;
    const r = cv.getBoundingClientRect();
    p.x = e.clientX - r.left; p.y = e.clientY - r.top;

    if (pts.size === 2 && pinch){
      e.preventDefault();
      const now = spanOf();
      /* Measured against where the fingers started, never step by step:
         a browser fires one pointermove per finger, so an incremental
         pinch applies its scaling twice per frame. */
      if (pinch.d > 8 && now.d > 8) pinchTo(now, pinch);
      return;
    }
    if (dragging && last){
      moved += Math.abs(p.x-last.x) + Math.abs(p.y-last.y);
      panByPixels(p.x - last.x, p.y - last.y);
      last = {x:p.x, y:p.y};
      if (moved > 4) elTip.setAttribute("data-on","false");
    }
  }, {passive:false});

  const release = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (pts.size === 0){ dragging = false; last = null; }
  };
  cv.addEventListener("pointerup", release);
  cv.addEventListener("pointercancel", release);
  cv.addEventListener("dblclick", e => {
    const r = cv.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, 1.8);
  });
  document.getElementById("resetview").addEventListener("click", resetView);
  /* Dragging must not leave a train's tooltip stranded mid-pan. */
  cv.addEventListener("pointerleave", () => { if (dragging) moved = 99; });
}

cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bestD = 14*14;
  for (const [x,y,t] of hitList){
    const d = (x-mx)**2 + (y-my)**2;
    if (d < bestD){ bestD = d; best = [x,y,t]; }
  }
  if (best){
    elTip.style.left = (best[0] + r.left) + "px";
    elTip.style.top  = (best[1] + r.top)  + "px";
    elTip.querySelector(".tn").textContent = best[2].name;
    elTip.querySelector(".th").textContent = best[2].head ? "to " + best[2].head : "";
    elTip.setAttribute("data-on","true");
  } else {
    elTip.setAttribute("data-on","false");
  }
});
cv.addEventListener("mouseleave", () => elTip.setAttribute("data-on","false"));

/* ====================================================================== */
function frame(now){
  const dt = Math.min(0.1, (now - lastFrame)/1000);
  lastFrame = now;
  if (playing && DATA){
    /* A network that sleeps overnight fast-forwards through the dead hours:
       nobody should sit through three empty hours of Tokyo at 4x. The
       thinning-out shoulders still read as time passing, so they run at the
       gentle boost; the stretch where the map is literally empty has
       nothing to read and gets three times that. */
    const min = Math.floor(simSec/60) % 1440;
    const moving = OCC ? OCC[min] : 1;
    ffwd = !!(NET.ffwdBelow && OCC && moving < NET.ffwdBelow);
    const boost = !ffwd ? 1
                : (NET.ffwdBoost || 5) * (moving === 0 ? 3 : 1);
    simSec += dt * minutesPerSecond * 60 * boost;
    if (simSec >= DAY_SECONDS) simSec -= DAY_SECONDS;
  }
  if (DATA) draw();
  requestAnimationFrame(frame);
}

{
  const rs = document.documentElement.style;
  rs.setProperty("--ink",    css(pick("ink")));
  rs.setProperty("--ink-2",  css(pick("ink2")));
  rs.setProperty("--ink-3",  css(pick("ink3")));
  rs.setProperty("--rule",   rgba(pick("rule"), 0.7));
  rs.setProperty("--panel",  rgba(pick("panel"), 0.82));
  rs.setProperty("--bg-bot", css(pick("bgBot")));
  for (const role of ["ice","ic","reg","night","tram"])
    rs.setProperty("--"+role, css(pick(role)));
}

/* A small, deliberate control surface for the video exporter: a scripted
   camera needs to place the frame exactly, which pretending to be a mouse
   cannot do. Nothing in the page uses it, and the page behaves identically
   whether or not anything ever calls it. */
window.railCam = {
  ready: () => !!(DATA && BASEVIEW),
  net: (id, viewId) => switchNetwork(id, viewId),
  deferredLoaded: () => !!(DATA && !DATA.defer),
  /* How wide this network's own frame is. A scripted camera needs it: no
     network zooms out past its preset, so a span wider than this one is not
     a frame the page will ever show. */
  baseSpan: () => BASEVIEW ? BASEVIEW.lon1 - BASEVIEW.lon0 : 0,
  /* Centre and width in degrees of longitude; span 0 means the preset.
     This is the same path a pinch takes, so a scripted frame and a
     hand-made one cannot drift apart. */
  camera(lonC, latC, spanLon){
    if (!BASEVIEW) return;
    if (spanLon) setUserView(lonC, latC, spanLon); else resetView();
  },
  time(sec){ simSec = sec; lastMinute = -1; },
  play(on){ playing = on; playBtn.setAttribute("aria-pressed", String(on));
            playBtn.textContent = on ? "Pause" : "Play"; },
  frame(){ draw(); },
};

new ResizeObserver(resize).observe(stage);
new ResizeObserver(sizeProfile).observe(document.getElementById("profile"));
switchNetwork(NETID, VIEWID);
requestAnimationFrame(frame);

})();
</script>
