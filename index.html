<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Wednesday on the German Rail Network</title>
<meta name="description" content="Every long-distance train in Germany over one Wednesday, animated from the real timetable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* The page deliberately ignores the viewer's light/dark preference: the
     background IS the clock, fading from daylight to a navigation-map night
     as the simulated day passes. Every colour below is interpolated in JS
     between a validated day step and a validated night step. */
  :root{
    --bg-top:#e7e3da; --bg-bot:#efece6;
    --ink:#1b1a18; --ink-2:#55524c; --ink-3:#8b877f;
    --rule:rgba(27,26,24,0.14); --panel:rgba(255,255,255,0.62);
    --ice:#2a78d6; --ic:#eb6834; --reg:#1baf7a; --night:#5d5b57;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg-bot);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #map{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---- clock ---------------------------------------------------------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:3;
    padding:22px 24px 0;text-align:center;pointer-events:none;
  }
  #clock{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-weight:300;
    font-size:clamp(3.2rem,9vw,6.4rem);
    line-height:0.94;
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  #clock .mins{opacity:0.55}
  #datum{
    margin-top:8px;
    font-size:0.76rem;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--ink-2);font-weight:400;
  }
  #running{
    margin-top:4px;font-size:0.72rem;letter-spacing:0.06em;color:var(--ink-3);
    font-family:"IBM Plex Mono",monospace;
  }

  /* ---- panels --------------------------------------------------------- */
  .panel{
    position:fixed;z-index:3;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  #legend{left:20px;bottom:20px;padding:13px 15px 11px;min-width:212px}
  #legend h2{
    font-size:0.62rem;letter-spacing:0.17em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;margin-bottom:9px;
  }
  .lg{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:0.83rem}
  .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
      box-shadow:0 0 0 2px var(--panel)}
  .lg .nm{flex:1 1 auto;color:var(--ink)}
  .lg .ct{
    font-family:"IBM Plex Mono",monospace;font-size:0.76rem;
    color:var(--ink-2);font-variant-numeric:tabular-nums;
  }
  #legend footer{
    margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);
    font-size:0.66rem;line-height:1.45;color:var(--ink-3);
  }

  #controls{
    right:20px;bottom:20px;padding:11px 14px;
    display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:0.78rem;color:var(--ink);
    background:transparent;border:1px solid var(--rule);
    border-radius:6px;padding:5px 11px;cursor:pointer;
    transition:background 0.15s,border-color 0.15s;
  }
  button:hover{background:rgba(128,128,128,0.13)}
  button[aria-pressed="true"]{border-color:currentColor}
  #play{min-width:64px;font-variant-numeric:tabular-nums}
  .spd{display:flex;gap:5px}
  .spd button{padding:5px 8px;font-family:"IBM Plex Mono",monospace;font-size:0.72rem}
  #scrub{
    -webkit-appearance:none;appearance:none;width:190px;height:3px;
    background:var(--rule);border-radius:2px;outline:none;cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--ink);cursor:pointer;
  }
  #scrub::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;background:var(--ink);cursor:pointer;
  }

  /* ---- provenance + table --------------------------------------------- */
  #meta{
    position:fixed;z-index:3;left:20px;top:20px;max-width:270px;
    font-size:0.68rem;line-height:1.5;color:var(--ink-3);
  }
  #meta strong{color:var(--ink-2);font-weight:500}
  #figbtn{position:fixed;z-index:3;right:20px;top:20px}
  #figures{
    right:20px;top:60px;padding:14px 16px;max-width:330px;display:none;
  }
  #figures[data-open="true"]{display:block}
  #figures h2{
    font-size:0.62rem;letter-spacing:0.17em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;margin-bottom:10px;
  }
  table{border-collapse:collapse;width:100%;font-size:0.78rem}
  th,td{text-align:right;padding:4px 0 4px 12px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  thead th{
    font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--rule);
  }
  tbody td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  tbody td:first-child{font-family:inherit;color:var(--ink)}
  tbody tr:last-child td{border-top:1px solid var(--rule);padding-top:7px}
  #figures p{margin-top:11px;font-size:0.66rem;line-height:1.5;color:var(--ink-3)}
  #figures a{color:var(--ink-2)}

  #tooltip{
    position:fixed;z-index:5;pointer-events:none;opacity:0;
    transform:translate(-50%,-140%);
    background:var(--panel);border:1px solid var(--rule);border-radius:7px;
    padding:6px 10px;font-size:0.76rem;white-space:nowrap;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:opacity 0.12s;
  }
  #tooltip[data-on="true"]{opacity:1}
  #tooltip .tn{font-weight:500}
  #tooltip .th{color:var(--ink-2);font-size:0.72rem}

  #loading{
    position:fixed;inset:0;z-index:9;display:grid;place-items:center;
    background:var(--bg-bot);font-size:0.8rem;color:var(--ink-3);
    letter-spacing:0.1em;text-transform:uppercase;
  }
  #loading[hidden]{display:none}

  @media (max-width:760px){
    /* Stack the chrome instead of letting the two panels collide. */
    #meta,#figbtn,#figures{display:none}
    #legend{left:10px;right:10px;bottom:66px;min-width:0;padding:10px 12px}
    #controls{left:10px;right:10px;bottom:10px;padding:8px 10px;gap:9px;
              justify-content:space-between}
    #scrub{flex:1 1 auto;width:auto;min-width:0}
    #play{min-width:56px;padding:5px 8px}
    .spd button{padding:4px 7px}
    #legend footer{font-size:0.62rem}
  }
  @media (max-width:760px) and (max-height:620px){
    #legend footer{display:none}
  }
</style>
</head>

<canvas id="map"></canvas>

<header>
  <div id="clock"><span class="hrs">--</span><span class="mins">:--</span></div>
  <div id="datum">&nbsp;</div>

<div id="meta"></div>

<button id="figbtn" class="panel" aria-expanded="false" aria-controls="figures">Figures</button>
<aside id="figures" class="panel" aria-label="Trains by category"></aside>

<div id="legend" class="panel">
  <h2>Train category</h2>
  <div id="legend-rows"></div>
  <footer id="legend-note"></footer>
</div>

<div id="controls" class="panel">
  <button id="play" aria-pressed="true">Pause</button>
  <input id="scrub" type="range" min="0" max="86399" step="60" value="0"

    <button data-mps="4">1&times;</button>
    <button data-mps="8" aria-pressed="true">2&times;</button>
    <button data-mps="16">4&times;</button>
  </div>
</div>

<div id="tooltip"><span class="tn"></span><br><span class="th"></span></div>
<div id="loading">Loading timetable</div>

<script>
(() => {
"use strict";

/* ====================================================================== */
/* Palette — day step and night step for every role. Everything on screen  */
/* is lerped between the two columns by `nightness` (0 = noon, 1 = deep     */
/* night). The three train hues are the first three slots of the validated  */
/* categorical palette; they clear the all-pairs CVD and normal-vision      */
/* gates against BOTH surfaces. Night trains fold to a neutral rather than  */
/* taking a fourth hue, because no fourth hue clears the gate in both.      */
/* ====================================================================== */
const DAY = {
  bgTop:"#e7e3da", bgBot:"#efece6",
  ink:"#1b1a18", ink2:"#55524c", ink3:"#8b877f",
  rule:"#d3cfc6", panel:"#ffffff",
  station:"#b3ada2", hub:"#8b877f",
  ice:"#2a78d6", ic:"#eb6834", reg:"#1baf7a", night:"#5d5b57",
};
const NIGHT = {
  bgTop:"#060d18", bgBot:"#0b1626",
  ink:"#eaf0f8", ink2:"#a9b4c6", ink3:"#6d7a8f",
  rule:"#243349", panel:"#101d30",
  station:"#2c3a50", hub:"#46566f",
  ice:"#3987e5", ic:"#d95926", reg:"#199e70", night:"#98a1b3",
};

const PANEL_ALPHA_DAY = 0.74, PANEL_ALPHA_NIGHT = 0.80;

/* ---- colour helpers --------------------------------------------------- */
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const RGB = {};
for (const k in DAY) RGB[k] = [hex2rgb(DAY[k]), hex2rgb(NIGHT[k])];

function mix(role, t){
  const [a,b] = RGB[role];
  return [Math.round(a[0]+(b[0]-a[0])*t),
          Math.round(a[1]+(b[1]-a[1])*t),
          Math.round(a[2]+(b[2]-a[2])*t)];
}
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ====================================================================== */
/* Sun position — drives the day/night fade. NOAA low-precision algorithm,  */
/* good to a fraction of a degree, which is far beyond what a colour fade   */
/* needs. Evaluated for the centre of Germany.                              */
/* ====================================================================== */
const CENTRE_LAT = 51.16, CENTRE_LON = 10.45;

function solarElevation(utcMs, lat, lon){
  const rad = Math.PI/180;
  const n = utcMs/86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474*n) % 360;
  const g = ((357.528 + 0.9856003*n) % 360) * rad;
  const lam = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * rad;
  const eps = (23.439 - 0.0000004*n) * rad;
  const dec = Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra  = Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam));
  const gmst = (18.697374558 + 24.06570982441908*n) % 24;
  const ha = ((gmst*15 + lon) * rad) - ra;
  const phi = lat*rad;
  return Math.asin(Math.sin(phi)*Math.sin(dec) +
                   Math.cos(phi)*Math.cos(dec)*Math.cos(ha)) / rad;
}

/* Last Sunday of a month, for the EU daylight-saving switch. */
function lastSunday(year, month){
  const d = new Date(Date.UTC(year, month+1, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d;
}
/* Berlin is UTC+1, or UTC+2 between 01:00 UTC on the last Sunday in March
   and the same moment on the last Sunday in October. */
function berlinOffsetHours(dateISO){
  const [y,m,dd] = dateISO.split("-").map(Number);
  const t = Date.UTC(y, m-1, dd, 12);
  const start = lastSunday(y,2).getTime() + 3600000;
  const end   = lastSunday(y,9).getTime() + 3600000;
  return (t >= start && t < end) ? 2 : 1;
}

const smoothstep = (a,b,x) => {
  const t = Math.min(1, Math.max(0, (x-a)/(b-a)));
  return t*t*(3-2*t);
};

/* ====================================================================== */
/* Data                                                                     */
/* ====================================================================== */
const raw = document.getElementById("traindata").textContent
              .replace("/*DATA_START*/","").replace("/*DATA_END*/","");
const DATA = JSON.parse(raw);

const CLASS_META = {
  ice:       {label:"ICE — high-speed",     role:"ice"},
  intercity: {label:"IC / EC — intercity",  role:"ic"},
  regional:  {label:"RE / RB — regional",   role:"reg"},
  night:     {label:"Night & international",role:"night"},
};
const CLASSES = DATA.classes || ["ice","intercity","regional","night"];

const DAY_SECONDS = 86400;
const TZ_OFFSET = berlinOffsetHours(DATA.date);
const DATE_UTC0 = Date.UTC(...DATA.date.split("-").map((v,i)=> i===1 ? v-1 : +v))
                  - TZ_OFFSET*3600000;   /* local midnight, as UTC ms */

/* Equidistant-cylindrical projection over a fixed frame on Germany, with the
   longitude axis scaled by cos(centre latitude) so the country keeps its true
   proportions. Mercator would stretch Germany about 60% taller than it is. */
const VIEW = {lon0:3.60, lon1:18.40, lat0:45.80, lat1:55.80};
const VIEW_MIDLAT = (VIEW.lat0+VIEW.lat1)/2;
const LON_SCALE = Math.cos(VIEW_MIDLAT*Math.PI/180);
const FRAME_ASPECT = ((VIEW.lon1-VIEW.lon0)*LON_SCALE) / (VIEW.lat1-VIEW.lat0);

/* Stations: [lon, lat, name] -> add projected unit coords and a call count. */
const ST = DATA.stations.map(s => ({
  lon:s[0], lat:s[1], name:s[2],
  ux:(s[0]-VIEW.lon0)/(VIEW.lon1-VIEW.lon0),
  uy:(VIEW.lat1-s[1])/(VIEW.lat1-VIEW.lat0),
  calls:0, x:0, y:0,
}));
for (const tr of DATA.trips) for (const st of tr.s) ST[st[0]].calls++;

/* Trips: precompute span so the active test is two comparisons. */
const TRIPS = DATA.trips.map(t => ({
  c:t.c, name:t.n, head:t.h, s:t.s,
  t0:t.s[0][1], t1:t.s[t.s.length-1][2],
}));

/* Label the busiest stations, thinned so labels never collide. */
const LABELS = ST.map((s,i)=>({s,i})).sort((a,b)=>b.s.calls-a.s.calls).slice(0,46);

/* Peak concurrent trains per class, for the figures table. */
const PEAK = (() => {
  const peak = CLASSES.map(()=>0), cur = CLASSES.map(()=>0);
  const ev = [];
  for (const t of TRIPS){ ev.push([t.t0,1,t.c]); ev.push([t.t1,-1,t.c]); }
  ev.sort((a,b)=>a[0]-b[0]);
  for (const [,d,c] of ev){ cur[c]+=d; if (cur[c]>peak[c]) peak[c]=cur[c]; }
  return peak;
})();

/* ====================================================================== */
/* Canvas                                                                   */
/* ====================================================================== */
const cv = document.getElementById("map");
const ctx = cv.getContext("2d", {alpha:false});
let W=0, H=0, PAD=0, SX=0, SY=0, OX=0, OY=0;

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  cv.style.width = W+"px"; cv.style.height = H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);

  /* Fit the frame, leaving a band at the top for the clock. */
  PAD = Math.min(W,H) * 0.03;
  const topBand = Math.min(104, H*0.115);
  const availW = W - PAD*2;
  const availH = H - PAD*2 - topBand;
  let h = availH, w = h*FRAME_ASPECT;
  if (w > availW){ w = availW; h = w/FRAME_ASPECT; }
  SX = w; SY = h;
  OX = (W-w)/2;
  OY = PAD + topBand + (availH-h)/2;

  for (const s of ST){ s.x = OX + s.ux*SX; s.y = OY + s.uy*SY; }
  placeLabels();
}

/* Greedy thinning: keep a label only if it clears the ones already kept. */
let shownLabels = [];
function placeLabels(){
  shownLabels = [];
  const minGap = Math.max(46, Math.min(W,H)*0.075);
  for (const L of LABELS){
    const {s} = L;
    if (s.x < OX-20 || s.x > OX+SX+20 || s.y < OY-10 || s.y > OY+SY+10) continue;
    let ok = true;
    for (const k of shownLabels){
      if (Math.abs(k.s.x-s.x) < minGap*1.5 && Math.abs(k.s.y-s.y) < minGap*0.42){ ok=false; break; }
    }
    if (ok) shownLabels.push(L);
    if (shownLabels.length >= 22) break;
  }
}

/* ====================================================================== */
/* Position lookup                                                          */
/* ====================================================================== */
/* Returns [x,y] on the canvas for trip `t` at local-second `sec`, or null.
   Between arrival and departure at a stop the train stands still, which is
   what makes the animation dwell at the big hubs. */
function posAt(t, sec){
  const s = t.s;
  if (sec < t.t0 || sec > t.t1) return null;
  let lo = 0, hi = s.length-1;
  while (lo < hi){
    const mid = (lo+hi+1) >> 1;
    if (s[mid][1] <= sec) lo = mid; else hi = mid-1;
  }
  const a = s[lo];
  if (lo === s.length-1 || sec <= a[2]){
    const st = ST[a[0]];
    return [st.x, st.y];
  }
  const b = s[lo+1];
  const span = b[1] - a[2];
  const f = span > 0 ? (sec - a[2]) / span : 0;
  const p = ST[a[0]], q = ST[b[0]];
  return [p.x + (q.x-p.x)*f, p.y + (q.y-p.y)*f];
}

/* ====================================================================== */
/* Clock state                                                              */
/* ====================================================================== */
let simSec = 5*3600;          /* start at 05:00, when the network wakes up */
let minutesPerSecond = 8;     /* 2x button: a full day in three minutes */
let playing = true;
let lastFrame = performance.now();

/* ====================================================================== */
/* Draw                                                                     */
/* ====================================================================== */
const TRAIL_SEC = 2400;       /* 40 simulated minutes of tail */
const TRAIL_STEPS = 9;
const hovering = {x:-1, y:-1, on:false};
let hitList = [];

function draw(){
  const utc = DATE_UTC0 + simSec*1000;
  const elev = solarElevation(utc, CENTRE_LAT, CENTRE_LON);
  /* Full day above +4 degrees, full night below -9; civil twilight between. */
  const nightness = 1 - smoothstep(-9, 4, elev);

  /* The sky, the stations and the train hues cross-fade continuously -- that
     slow slide into night is the whole point. Text and panels must NOT: a
     linear fade takes ink and its panel through the same mid-grey at dusk and
     their contrast collapses to nothing. They switch over a narrow band
     instead, so the chrome is always either dark-on-light or light-on-dark. */
  const tUI = smoothstep(0.44, 0.56, nightness);

  const bgTop = mix("bgTop", nightness), bgBot = mix("bgBot", nightness);
  const cInk  = mix("ink", tUI),  cInk2 = mix("ink2", tUI);
  const cInk3 = mix("ink3", tUI), cRule = mix("rule", tUI);
  const cSt   = mix("station", nightness), cHub = mix("hub", nightness);
  const cPanel= mix("panel", tUI);
  const hues  = CLASSES.map(k => mix(CLASS_META[k].role, nightness));

  /* Hand the interpolated palette to CSS so the panels track the sky. */
  const rs = document.documentElement.style;
  rs.setProperty("--ink", css(cInk));
  rs.setProperty("--ink-2", css(cInk2));
  rs.setProperty("--ink-3", css(cInk3));
  rs.setProperty("--rule", rgba(cRule, 0.55));
  rs.setProperty("--panel", rgba(cPanel,
      PANEL_ALPHA_DAY + (PANEL_ALPHA_NIGHT-PANEL_ALPHA_DAY)*tUI));
  rs.setProperty("--bg-bot", css(bgBot));
  CLASSES.forEach((k,i) => rs.setProperty("--" + CLASS_META[k].role, css(hues[i])));

  /* --- sky --- */
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, css(bgTop));
  g.addColorStop(1, css(bgBot));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  /* --- stations --- */
  ctx.lineWidth = 1;
  for (const s of ST){
    if (s.x < -30 || s.x > W+30 || s.y < -30 || s.y > H+30) continue;
    const big = s.calls >= 40;
    ctx.beginPath();
    ctx.arc(s.x, s.y, big ? 2.1 : 1.2, 0, 6.2832);
    ctx.fillStyle = rgba(big ? cHub : cSt, big ? 0.85 : 0.55);
    ctx.fill();
  }

  /* --- station labels --- */
  ctx.font = '400 10.5px "IBM Plex Sans",system-ui,sans-serif';
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = rgba(bgBot, 0.9);
  for (const L of shownLabels){
    const s = L.s;
    ctx.strokeText(s.name, s.x + 5.5, s.y - 5.5);
  }
  ctx.fillStyle = rgba(cInk3, 0.95);
  for (const L of shownLabels){
    const s = L.s;
    ctx.fillText(s.name, s.x + 5.5, s.y - 5.5);
  }

  /* --- trains --- */
  hitList = [];
  const glow = nightness > 0.25;
  for (const t of TRIPS){
    /* A trip that starts before midnight and runs past it is drawn twice:
       once for its own day, once wrapped into the next. */
    for (const off of (t.t1 > DAY_SECONDS ? [0, DAY_SECONDS] : [0])){
      const sec = simSec + off;
      const head = posAt(t, sec);
      if (!head) continue;
      if (head[0] < -60 || head[0] > W+60 || head[1] < -60 || head[1] > H+60) continue;

      const col = hues[t.c];

      /* Trail: a tapering polyline back through the last 15 sim-minutes.
         It is what makes direction of travel readable at a glance. */
      let px = head[0], py = head[1];
      for (let k = 1; k <= TRAIL_STEPS; k++){
        const back = posAt(t, sec - (TRAIL_SEC/TRAIL_STEPS)*k);
        if (!back) break;
        const a = (1 - k/TRAIL_STEPS) * 0.55;
        if (a <= 0.02) break;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(back[0], back[1]);
        ctx.strokeStyle = rgba(col, a);
        ctx.lineWidth = 2.4 * (1 - k/(TRAIL_STEPS+3));
        ctx.lineCap = "round";
        ctx.stroke();
        px = back[0]; py = back[1];
      }

      if (glow){
        ctx.beginPath();
        ctx.arc(head[0], head[1], 5.2, 0, 6.2832);
        ctx.fillStyle = rgba(col, 0.16 * nightness);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(head[0], head[1], 2.6, 0, 6.2832);
      ctx.fillStyle = rgba(col, 0.98);
      ctx.fill();

      hitList.push([head[0], head[1], t]);
    }
  }

  updateChrome(nightness);
}

/* ====================================================================== */
/* Chrome                                                                   */
/* ====================================================================== */
const elClock = document.getElementById("clock");
const elHrs = elClock.querySelector(".hrs");
const elMins = elClock.querySelector(".mins");
const elDatum = document.getElementById("datum");
const elRunning = document.getElementById("running");
const elScrub = document.getElementById("scrub");
const elTip = document.getElementById("tooltip");

const pad2 = n => String(n).padStart(2,"0");
let lastMinute = -1;

function updateChrome(){
  const mins = Math.floor(simSec/60);
  if (mins !== lastMinute){
    lastMinute = mins;
    elHrs.textContent = pad2(Math.floor(mins/60) % 24);
    elMins.textContent = ":" + pad2(mins % 60);
    elScrub.value = simSec;
    const counts = CLASSES.map(()=>0);
    for (const [,,t] of hitList) counts[t.c]++;
    let total = 0;
    counts.forEach((c,i) => {
      total += c;
      const el = document.getElementById("lg-count-"+i);
      if (el) el.textContent = c;
    });
    elRunning.textContent = total + (total === 1 ? " train running" : " trains running");
  }
}

/* ---- legend ----------------------------------------------------------- */
{
  const rows = document.getElementById("legend-rows");
  CLASSES.forEach((k,i) => {
    const meta = CLASS_META[k] || {label:k, role:"night"};
    const row = document.createElement("div");
    row.className = "lg";
    row.innerHTML =
      '<span class="sw" style="background:var(--' + meta.role + ')"></span>' +
      '<span class="nm">' + meta.label + '</span>' +
      '<span class="ct" id="lg-count-' + i + '">0</span>';
    rows.appendChild(row);
  });
  document.getElementById("legend-note").textContent =
    "Count = trains moving at this minute. Urban transit (S-Bahn, U-Bahn, tram, bus) is excluded.";
}

/* ---- provenance ------------------------------------------------------- */
document.getElementById("meta").innerHTML =
  "<strong>" + DATA.trips.length + " scheduled trains</strong> over one " +
  DATA.weekday + " on the German long-distance network, drawn from the " +
  "published timetable for " + new Date(DATA.date+"T12:00:00Z").toLocaleDateString("en-GB",
    {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"}) + ".";

/* ---- figures table ---------------------------------------------------- */
{
  const fig = document.getElementById("figures");
  const rows = CLASSES.map((k,i) => {
    const meta = CLASS_META[k] || {label:k};
    return "<tr><td>" + meta.label + "</td><td>" +
           (DATA.counts[k] || 0) + "</td><td>" + PEAK[i] + "</td></tr>";
  }).join("");
  const totalTrips = CLASSES.reduce((a,k)=>a+(DATA.counts[k]||0), 0);
  fig.innerHTML =
    "<h2>Trains by category</h2>" +
    "<table><thead><tr><th>Category</th><th>Trips</th><th>Peak</th></tr></thead>" +
    "<tbody>" + rows +
    "<tr><td>All categories</td><td>" + totalTrips + "</td><td>" +
    "&mdash;</td></tr></tbody></table>" +
    "<p>Trips = distinct scheduled services on the day. Peak = the most of " +
    "that category moving at once. Source: " + DATA.source + ".</p>";

  const btn = document.getElementById("figbtn");
  btn.addEventListener("click", () => {
    const open = fig.getAttribute("data-open") === "true";
    fig.setAttribute("data-open", String(!open));
    btn.setAttribute("aria-expanded", String(!open));
  });
}

/* ---- controls --------------------------------------------------------- */
const playBtn = document.getElementById("play");
playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
  playBtn.setAttribute("aria-pressed", String(playing));
});
document.querySelectorAll(".spd button").forEach(b => {
  b.addEventListener("click", () => {
    minutesPerSecond = +b.dataset.mps;
    document.querySelectorAll(".spd button").forEach(o =>
      o.setAttribute("aria-pressed", String(o === b)));
  });
});
elScrub.addEventListener("input", () => { simSec = +elScrub.value; lastMinute = -1; });
window.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); playBtn.click(); }
});

/* ---- hover ------------------------------------------------------------ */
cv.addEventListener("mousemove", e => {
  hovering.x = e.clientX; hovering.y = e.clientY; hovering.on = true;
  let best = null, bestD = 13*13;
  for (const [x,y,t] of hitList){
    const d = (x-hovering.x)**2 + (y-hovering.y)**2;
    if (d < bestD){ bestD = d; best = [x,y,t]; }
  }
  if (best){
    elTip.style.left = best[0] + "px";
    elTip.style.top  = best[1] + "px";
    elTip.querySelector(".tn").textContent = best[2].name;
    elTip.querySelector(".th").textContent = best[2].head ? "to " + best[2].head : "";
    elTip.setAttribute("data-on","true");
  } else {
    elTip.setAttribute("data-on","false");
  }
});
cv.addEventListener("mouseleave", () => {
  hovering.on = false;
  elTip.setAttribute("data-on","false");
});

/* ---- loop ------------------------------------------------------------- */
function frame(now){
  const dt = Math.min(0.1, (now - lastFrame)/1000);
  lastFrame = now;
  if (playing){
    simSec += dt * minutesPerSecond * 60;
    if (simSec >= DAY_SECONDS) simSec -= DAY_SECONDS;
  }
  draw();
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
resize();
elDatum.textContent = new Date(DATA.date+"T12:00:00Z").toLocaleDateString("en-GB",
  {weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});
document.getElementById("loading").hidden = true;
requestAnimationFrame(frame);

})();
</script>
