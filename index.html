<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Wednesday on the German Rail Network</title>
<meta name="description" content="Every long-distance train in Germany over one Wednesday, animated from the real timetable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* The page ignores the viewer's light/dark preference on purpose: the map
     is lit by the simulated time of day, and flips to night at sunset. */
  :root{
    --bg-bot:#efece6;
    --ink:#1b1a18; --ink-2:#55524c; --ink-3:#8b877f;
    --rule:rgba(27,26,24,0.14); --panel:rgba(255,255,255,0.74);
    --ice:#2a78d6; --ic:#eb6834; --reg:#1baf7a; --night:#5d5b57;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg-bot);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* Desktop: the stage fills the viewport and the dock's children float on it.
     display:contents lets legend/controls position against the viewport. */
  #stage{position:fixed;inset:0;overflow:hidden}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block}
  #dock{display:contents}

  /* ---- clock ---------------------------------------------------------- */
  header{
    position:absolute;top:0;left:0;right:0;z-index:3;
    padding:22px 24px 0;text-align:center;pointer-events:none;
  }
  #clock{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-weight:300;
    font-size:clamp(3.2rem,9vw,6.4rem);
    line-height:0.94;
    letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  #clock .mins{opacity:0.55}
  #datum{
    margin-top:8px;
    font-size:0.76rem;letter-spacing:0.18em;text-transform:uppercase;
    color:var(--ink-2);font-weight:400;
  }
  #running{
    margin-top:4px;font-size:0.72rem;letter-spacing:0.06em;color:var(--ink-3);
    font-family:"IBM Plex Mono",monospace;
  }

  /* ---- panels --------------------------------------------------------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  }
  #legend{position:fixed;z-index:3;left:20px;bottom:20px;padding:13px 15px 11px;min-width:222px;max-width:330px}
  #legend h2,#figures h2{
    font-size:0.62rem;letter-spacing:0.17em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;margin-bottom:9px;
  }
  .lg{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:0.83rem}
  .sw{border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px var(--panel)}
  .lg .nm{flex:1 1 auto;color:var(--ink)}
  .lg .ct{
    font-family:"IBM Plex Mono",monospace;font-size:0.76rem;
    color:var(--ink-2);font-variant-numeric:tabular-nums;
  }
  #legend footer{
    margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);
    font-size:0.66rem;line-height:1.45;color:var(--ink-3);
  }

  #controls{
    position:fixed;z-index:3;right:20px;bottom:20px;padding:11px 14px;
    display:flex;align-items:center;gap:12px;
  }
  button{
    font:inherit;font-size:0.78rem;color:var(--ink);
    background:transparent;border:1px solid var(--rule);
    border-radius:6px;padding:5px 11px;cursor:pointer;
    transition:background 0.15s,border-color 0.15s;
  }
  button:hover{background:rgba(128,128,128,0.13)}
  button[aria-pressed="true"]{border-color:currentColor}
  #play{min-width:64px}
  .spd{display:flex;gap:5px}
  .spd button{padding:5px 8px;font-family:"IBM Plex Mono",monospace;font-size:0.72rem}
  #scrub{
    -webkit-appearance:none;appearance:none;width:190px;height:3px;
    background:var(--rule);border-radius:2px;outline:none;cursor:pointer;
  }
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--ink);cursor:pointer;
  }
  #scrub::-moz-range-thumb{
    width:13px;height:13px;border:0;border-radius:50%;background:var(--ink);cursor:pointer;
  }

  /* ---- provenance + table --------------------------------------------- */
  #meta{
    position:absolute;z-index:3;left:20px;top:20px;max-width:268px;
    font-size:0.68rem;line-height:1.5;color:var(--ink-3);
  }
  #meta strong{color:var(--ink-2);font-weight:500}
  #figbtn{position:fixed;z-index:4;right:20px;top:20px}
  #figures{position:fixed;z-index:3;right:20px;top:60px;padding:14px 16px;max-width:335px;display:none}
  #figures[data-open="true"]{display:block}
  table{border-collapse:collapse;width:100%;font-size:0.78rem}
  th,td{text-align:right;padding:4px 0 4px 12px;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  thead th{
    font-size:0.62rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--rule);
  }
  tbody td{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  tbody td:first-child{font-family:inherit;color:var(--ink)}
  tbody tr:last-child td{border-top:1px solid var(--rule);padding-top:7px}
  #figures p{margin-top:11px;font-size:0.66rem;line-height:1.5;color:var(--ink-3)}

  #tooltip{
    position:fixed;z-index:5;pointer-events:none;opacity:0;
    transform:translate(-50%,-140%);
    background:var(--panel);border:1px solid var(--rule);border-radius:7px;
    padding:6px 10px;font-size:0.76rem;white-space:nowrap;
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    transition:opacity 0.12s;
  }
  #tooltip[data-on="true"]{opacity:1}
  #tooltip .tn{font-weight:500}
  #tooltip .th{color:var(--ink-2);font-size:0.72rem}

  #hint{display:none}

  #loading{
    position:fixed;inset:0;z-index:9;display:grid;place-items:center;
    background:var(--bg-bot);font-size:0.8rem;color:var(--ink-3);
    letter-spacing:0.1em;text-transform:uppercase;
  }
  #loading[hidden]{display:none}

  /* ---- narrow screens -------------------------------------------------- */
  /* The map keeps a full screen to itself; everything else moves below the
     fold, so the whole country is visible without a panel sitting on it. */
  @media (max-width:820px){
    body{overflow:auto;overflow-x:hidden}
    #stage{position:relative;inset:auto;width:100%;height:100svh;height:100dvh}
    #meta,#figbtn{display:none}
    #dock{
      display:flex;flex-direction:column;gap:12px;
      padding:12px 12px 20px;
    }
    #legend,#controls,#figures{position:static;z-index:auto;max-width:none;min-width:0}
    #figures{display:block}
    #controls{flex-wrap:wrap;justify-content:space-between;padding:12px 14px}
    #scrub{flex:1 1 130px;width:auto;min-width:0}
    #hint{
      display:block;position:absolute;left:0;right:0;bottom:10px;z-index:3;
      text-align:center;font-size:0.64rem;letter-spacing:0.14em;
      text-transform:uppercase;color:var(--ink-3);pointer-events:none;
    }
    #hint span{display:block;font-size:0.9rem;line-height:1;margin-top:2px}
  }
</style>
</head>

</div>

<script>
(() => {
"use strict";

/* ====================================================================== */
/* Palette. Day and night are two complete sets; the map switches between   */
/* them at sunset rather than cross-fading. The three train hues are the    */
/* first three slots of a colourblind-safe categorical palette and clear    */
/* the all-pairs CVD and normal-vision gates against BOTH surfaces. Night   */
/* services fold to a neutral because no fourth hue clears both.            */
/* ====================================================================== */
const DAY = {
  bgTop:"#e7e3da", bgBot:"#efece6",
  land:"#e5e0d5", landLine:"#d5cfc1", landEdge:"#b4ada0",
  ink:"#1b1a18", ink2:"#55524c", ink3:"#8b877f",
  rule:"#d3cfc6", panel:"#ffffff",
  station:"#b3ada2", hub:"#8b877f",
  ice:"#2a78d6", ic:"#eb6834", reg:"#1baf7a", night:"#5d5b57",
};
const NIGHT = {
  bgTop:"#060d18", bgBot:"#0b1626",
  land:"#101e33", landLine:"#1b2d47", landEdge:"#354864",
  ink:"#eaf0f8", ink2:"#a9b4c6", ink3:"#6d7a8f",
  rule:"#243349", panel:"#101d30",
  station:"#2c3a50", hub:"#46566f",
  ice:"#3987e5", ic:"#d95926", reg:"#199e70", night:"#98a1b3",
};

const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const RGB = {};
for (const k in DAY) RGB[k] = [hex2rgb(DAY[k]), hex2rgb(NIGHT[k])];
const pick = (role, isNight) => RGB[role][isNight ? 1 : 0];
const css  = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* ====================================================================== */
/* Sun. NOAA low-precision solar position for the centre of Germany; the    */
/* map is "night" whenever the sun is below the horizon.                    */
/* ====================================================================== */
const CENTRE_LAT = 51.16, CENTRE_LON = 10.45;

function solarElevation(utcMs, lat, lon){
  const rad = Math.PI/180;
  const n = utcMs/86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474*n) % 360;
  const g = ((357.528 + 0.9856003*n) % 360) * rad;
  const lam = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * rad;
  const eps = (23.439 - 0.0000004*n) * rad;
  const dec = Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra  = Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam));
  const gmst = (18.697374558 + 24.06570982441908*n) % 24;
  const ha = ((gmst*15 + lon) * rad) - ra;
  const phi = lat*rad;
  return Math.asin(Math.sin(phi)*Math.sin(dec) +
                   Math.cos(phi)*Math.cos(dec)*Math.cos(ha)) / rad;
}

function lastSunday(year, month){
  const d = new Date(Date.UTC(year, month+1, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d;
}
/* Berlin runs UTC+1, or UTC+2 from 01:00 UTC on the last Sunday in March to
   the same moment on the last Sunday in October. */
function berlinOffsetHours(dateISO){
  const [y,m,dd] = dateISO.split("-").map(Number);
  const t = Date.UTC(y, m-1, dd, 12);
  return (t >= lastSunday(y,2).getTime()+3600000 &&
          t <  lastSunday(y,9).getTime()+3600000) ? 2 : 1;
}

/* ====================================================================== */
/* Data                                                                     */
/* ====================================================================== */
const readJSON = (id, a, b) => JSON.parse(
  document.getElementById(id).textContent.replace(a,"").replace(b,""));
const DATA = readJSON("traindata", "/*DATA_START*/", "/*DATA_END*/");
const GEO  = readJSON("geodata",   "/*GEO_START*/",  "/*GEO_END*/");

/* Relative dot size per category: regional is deliberately the quietest mark

const CLASS_META = {
  ice:       {label:"ICE / TGV / RJ — high-speed", role:"ice",   size:1.00},
  intercity: {label:"IC / EC — intercity",         role:"ic",    size:1.00},
  regional:  {label:"RE / RB — regional",          role:"reg",   size:0.52},
  night:     {label:"NJ / EN — night",             role:"night", size:0.85},
};
const CLASSES = DATA.classes || ["ice","intercity","regional","night"];

const DAY_SECONDS = 86400;
const TZ_OFFSET = berlinOffsetHours(DATA.date);
const DATE_UTC0 = Date.UTC(...DATA.date.split("-").map((v,i)=> i===1 ? v-1 : +v))
                  - TZ_OFFSET*3600000;

/* Equidistant-cylindrical frame with the longitude axis scaled by cos(lat):
   Mercator would stretch Germany about 60% taller than it is. */
const VIEW = {lon0:4.60, lon1:17.00, lat0:46.50, lat1:55.50};
const LON_SCALE = Math.cos(((VIEW.lat0+VIEW.lat1)/2)*Math.PI/180);
const FRAME_ASPECT = ((VIEW.lon1-VIEW.lon0)*LON_SCALE) / (VIEW.lat1-VIEW.lat0);
const ux = lon => (lon-VIEW.lon0)/(VIEW.lon1-VIEW.lon0);
const uy = lat => (VIEW.lat1-lat)/(VIEW.lat1-VIEW.lat0);

const ST = DATA.stations.map(s => ({
  name:s[2], ux:ux(s[0]), uy:uy(s[1]), calls:0, x:0, y:0,
}));
for (const tr of DATA.trips) for (const st of tr.s) ST[st[0]].calls++;
/* Hubs are the top stations by calls, not an absolute cutoff: a fixed
   threshold turns every hourly-served town in a dense regional feed into a
   "hub" and draws a grey constellation around Berlin. */
{
  const sorted = ST.map(s=>s.calls).sort((a,b)=>b-a);
  const hubMin = sorted[Math.min(44, sorted.length-1)] || 1;
  for (const s of ST) s.hub = s.calls >= hubMin;
}

  t0:t.s[0][1], t1:t.s[t.s.length-1][2],

  ["Leipzig","Leipzig Hbf"], ["Dresden","Dresden Hbf"],
  ["Frankfurt","Frankfurt(Main)Hbf"], ["Nürnberg","Nürnberg Hbf"],
  ["Stuttgart","Stuttgart Hbf"], ["München","München Hbf"],
];
const LABELS = [];
for (const [label, stop] of CITIES){
  const i = ST.findIndex(s => s.name === stop);
  if (i >= 0) LABELS.push({label, s:ST[i]});
}

const PEAK = (() => {
  const peak = CLASSES.map(()=>0), cur = CLASSES.map(()=>0), ev = [];
  for (const t of TRIPS){ ev.push([t.t0,1,t.c]); ev.push([t.t1,-1,t.c]); }
  ev.sort((a,b)=>a[0]-b[0]);
  for (const [,d,c] of ev){ cur[c]+=d; if (cur[c]>peak[c]) peak[c]=cur[c]; }
  return peak;
})();

/* ====================================================================== */
/* Canvas                                                                   */
/* ====================================================================== */
const stage = document.getElementById("stage");
const cv = document.getElementById("map");
const ctx = cv.getContext("2d", {alpha:false});
let W=0, H=0, SX=0, SY=0, OX=0, OY=0;
let pathLand = null, pathStates = null;

function buildBasemap(){
  const ring = (path, r) => {
    path.moveTo(OX + ux(r[0][0])*SX, OY + uy(r[0][1])*SY);
    for (let i=1;i<r.length;i++) path.lineTo(OX + ux(r[i][0])*SX, OY + uy(r[i][1])*SY);
    path.closePath();
  };
  pathLand = new Path2D();
  for (const r of GEO.outline) ring(pathLand, r);
  pathStates = new Path2D();
  for (const r of GEO.states) ring(pathStates, r);
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  W = stage.clientWidth; H = stage.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const PAD = Math.min(W,H) * 0.03;
  const topBand = Math.min(104, H*0.115);
  /* Below the fold on mobile, so the map no longer has to dodge the panels. */
  const botBand = window.matchMedia("(max-width:820px)").matches ? 26 : 92;
  const availW = W - PAD*2;
  const availH = H - PAD*2 - topBand - botBand;
  let h = availH, w = h*FRAME_ASPECT;
  if (w > availW){ w = availW; h = w/FRAME_ASPECT; }
  SX = w; SY = h;
  OX = (W-w)/2;
  /* Bias upward rather than centring: on a portrait screen the frame is
     width-limited and dead space below reads better than above. */
  OY = PAD + topBand + (availH-h)*0.40;

  for (const s of ST){ s.x = OX + s.ux*SX; s.y = OY + s.uy*SY; }
  buildBasemap();
}

/* ====================================================================== */
/* Position lookup                                                          */
/* ====================================================================== */
function posAt(t, sec){
  const s = t.s;
  if (sec < t.t0 || sec > t.t1) return null;
  let lo = 0, hi = s.length-1;
  while (lo < hi){
    const mid = (lo+hi+1) >> 1;
    if (s[mid][1] <= sec) lo = mid; else hi = mid-1;
  }
  const a = s[lo];
  if (lo === s.length-1 || sec <= a[2]){
    const st = ST[a[0]];
    return [st.x, st.y];
  }
  const b = s[lo+1];
  const span = b[1] - a[2];
  const f = span > 0 ? (sec - a[2]) / span : 0;
  const p = ST[a[0]], q = ST[b[0]];
  return [p.x + (q.x-p.x)*f, p.y + (q.y-p.y)*f];
}

/* ====================================================================== */
/* Clock state                                                              */
/* ====================================================================== */
let simSec = 5*3600;
let minutesPerSecond = 8;
let playing = true;
let lastFrame = performance.now();

const TRAIL_SEC = 1200;       /* 20 simulated minutes of tail */
const TRAIL_STEPS = 7;
const DOT_R = 1.8;
let hitList = [];
let wasNight = null;

/* ====================================================================== */
/* Draw                                                                     */
/* ====================================================================== */
function draw(){
  const isNight = solarElevation(DATE_UTC0 + simSec*1000, CENTRE_LAT, CENTRE_LON) <= 0;

  const bgTop = pick("bgTop",isNight),  bgBot = pick("bgBot",isNight);
  const cLand = pick("land",isNight),   cLine = pick("landLine",isNight);
  const cEdge = pick("landEdge",isNight);
  const cInk3 = pick("ink3",isNight);
  const cSt   = pick("station",isNight),cHub  = pick("hub",isNight);
  const hues  = CLASSES.map(k => pick(CLASS_META[k].role, isNight));

  if (isNight !== wasNight){
    wasNight = isNight;
    const rs = document.documentElement.style;
    rs.setProperty("--ink",   css(pick("ink",isNight)));
    rs.setProperty("--ink-2", css(pick("ink2",isNight)));
    rs.setProperty("--ink-3", css(cInk3));
    rs.setProperty("--rule",  rgba(pick("rule",isNight), 0.55));
    rs.setProperty("--panel", rgba(pick("panel",isNight), isNight ? 0.80 : 0.74));
    rs.setProperty("--bg-bot", css(bgBot));
    CLASSES.forEach((k,i) => rs.setProperty("--"+CLASS_META[k].role, css(hues[i])));
  }

  /* --- sky --- */
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, css(bgTop));
  g.addColorStop(1, css(bgBot));
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  /* --- Germany: land, state borders, national border. Deliberately quiet;
         it is there to orient the eye, not to be read. --- */
  if (pathLand){
    ctx.fillStyle = css(cLand);
    ctx.fill(pathLand, "evenodd");
    ctx.lineJoin = "round";
    ctx.strokeStyle = rgba(cLine, 0.9);
    ctx.lineWidth = 0.8;
    ctx.stroke(pathStates);
    ctx.strokeStyle = rgba(cEdge, 0.85);
    ctx.lineWidth = 1.1;
    ctx.stroke(pathLand);
  }

  /* --- stations --- */
  for (const s of ST){
    if (s.x < -30 || s.x > W+30 || s.y < -30 || s.y > H+30) continue;
    const big = s.hub;
    ctx.beginPath();
    ctx.arc(s.x, s.y, big ? 1.7 : 0.9, 0, 6.2832);
    ctx.fillStyle = rgba(big ? cHub : cSt, big ? 0.8 : 0.45);
    ctx.fill();
  }

  /* --- trains --- */
  hitList = [];
  for (const t of TRIPS){
    const meta = CLASS_META[CLASSES[t.c]] || {size:1};
    /* A trip running past midnight is drawn twice: its own day, and wrapped. */
    for (const off of (t.t1 > DAY_SECONDS ? [0, DAY_SECONDS] : [0])){
      const sec = simSec + off;
      const head = posAt(t, sec);
      if (!head) continue;
      if (head[0] < -60 || head[0] > W+60 || head[1] < -60 || head[1] > H+60) continue;

      const col = hues[t.c], scale = meta.size;

      let px = head[0], py = head[1];
      for (let k = 1; k <= TRAIL_STEPS; k++){
        const back = posAt(t, sec - (TRAIL_SEC/TRAIL_STEPS)*k);
        if (!back) break;
        const a = (1 - k/TRAIL_STEPS) * 0.55;
        if (a <= 0.02) break;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(back[0], back[1]);
        ctx.strokeStyle = rgba(col, a);
        ctx.lineWidth = 2.4 * scale * (1 - k/(TRAIL_STEPS+3));
        ctx.lineCap = "round";
        ctx.stroke();
        px = back[0]; py = back[1];
      }

      if (isNight){
        ctx.beginPath();
        ctx.arc(head[0], head[1], 3.6*scale, 0, 6.2832);
        ctx.fillStyle = rgba(col, 0.16);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(head[0], head[1], DOT_R*scale, 0, 6.2832);
      ctx.fillStyle = rgba(col, 0.98);
      ctx.fill();

      hitList.push([head[0], head[1], t]);
    }
  }

  /* --- city names, drawn last so the trains never bury them --- */
  ctx.font = '400 11px "IBM Plex Sans",system-ui,sans-serif';
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.lineWidth = 3;
  ctx.strokeStyle = rgba(bgBot, 0.85);
  for (const L of LABELS) ctx.strokeText(L.label, L.s.x + 6, L.s.y - 6);
  ctx.fillStyle = rgba(cInk3, 0.95);
  for (const L of LABELS) ctx.fillText(L.label, L.s.x + 6, L.s.y - 6);

  updateChrome();
}

/* ====================================================================== */
/* Chrome                                                                   */
/* ====================================================================== */
const elClock = document.getElementById("clock");
const elHrs = elClock.querySelector(".hrs");
const elMins = elClock.querySelector(".mins");
const elScrub = document.getElementById("scrub");
const elRunning = document.getElementById("running");
const elTip = document.getElementById("tooltip");
const pad2 = n => String(n).padStart(2,"0");
let lastMinute = -1;

function updateChrome(){
  const mins = Math.floor(simSec/60);
  if (mins === lastMinute) return;
  lastMinute = mins;
  elHrs.textContent = pad2(Math.floor(mins/60) % 24);
  elMins.textContent = ":" + pad2(mins % 60);
  elScrub.value = simSec;
  const counts = CLASSES.map(()=>0);
  for (const [,,t] of hitList) counts[t.c]++;
  let total = 0;
  counts.forEach((c,i) => {
    total += c;
    const el = document.getElementById("lg-count-"+i);
    if (el) el.textContent = c;
  });
  elRunning.textContent = total + (total === 1 ? " train running" : " trains running");
}

{
  const rows = document.getElementById("legend-rows");
  CLASSES.forEach((k,i) => {
    const meta = CLASS_META[k] || {label:k, role:"night", size:1};
    const d = Math.max(6, Math.round(11*meta.size));
    rows.insertAdjacentHTML("beforeend",
      '<div class="lg"><span class="sw" style="background:var(--'+meta.role+
      ');width:'+d+'px;height:'+d+'px;margin:0 '+((11-d)/2)+'px"></span>'+
      '<span class="nm">'+meta.label+'</span>'+
      '<span class="ct" id="lg-count-'+i+'">0</span></div>');
  });
  const scopeNote = DATA.note ? " " + DATA.note.split(" \u2014 ")[0] + "." : "";
  document.getElementById("legend-note").textContent =
    "Count = trains moving at this minute. Dot size follows category; regional " +
    "is drawn small. Urban transit (S-Bahn, U-Bahn, tram, bus) is excluded." +
    scopeNote;
}

document.getElementById("meta").innerHTML =
  "<strong>" + DATA.trips.length + " scheduled trains</strong> over one " +
  DATA.weekday + " on the German rail network, drawn from published " +
  "timetables for " + new Date(DATA.date+"T12:00:00Z").toLocaleDateString(
    "en-GB", {day:"numeric", month:"long", year:"numeric", timeZone:"UTC"}) + ".";

{
  const fig = document.getElementById("figures");
  const rows = CLASSES.map((k,i) =>
    "<tr><td>" + (CLASS_META[k]||{label:k}).label + "</td><td>" +
    (DATA.counts[k]||0) + "</td><td>" + PEAK[i] + "</td></tr>").join("");
  const total = CLASSES.reduce((a,k)=>a+(DATA.counts[k]||0), 0);
  fig.innerHTML =
    "<h2>Trains by category</h2>" +
    "<table><thead><tr><th>Category</th><th>Trips</th><th>Peak</th></tr></thead><tbody>" +
    rows + "<tr><td>All categories</td><td>" + total + "</td><td>&mdash;</td></tr>" +
    "</tbody></table><p>Trips = distinct scheduled services on the day. Peak = " +
    "the most of that category moving at once." +
    (DATA.note ? " " + DATA.note : "") + " Source: " + DATA.source + ".</p>";

  const btn = document.getElementById("figbtn");
  btn.addEventListener("click", () => {
    const open = fig.getAttribute("data-open") === "true";
    fig.setAttribute("data-open", String(!open));
    btn.setAttribute("aria-expanded", String(!open));
  });
}

const playBtn = document.getElementById("play");
playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
  playBtn.setAttribute("aria-pressed", String(playing));
});
document.querySelectorAll(".spd button").forEach(b => {
  b.addEventListener("click", () => {
    minutesPerSecond = +b.dataset.mps;
    document.querySelectorAll(".spd button").forEach(o =>
      o.setAttribute("aria-pressed", String(o === b)));
  });
});
elScrub.addEventListener("input", () => { simSec = +elScrub.value; lastMinute = -1; });
window.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "INPUT"){ e.preventDefault(); playBtn.click(); }
});

cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  let best = null, bestD = 14*14;
  for (const [x,y,t] of hitList){
    const d = (x-mx)**2 + (y-my)**2;
    if (d < bestD){ bestD = d; best = [x,y,t]; }
  }
  if (best){
    elTip.style.left = (best[0] + r.left) + "px";
    elTip.style.top  = (best[1] + r.top)  + "px";
    elTip.querySelector(".tn").textContent = best[2].name;
    elTip.querySelector(".th").textContent = best[2].head ? "to " + best[2].head : "";
    elTip.setAttribute("data-on","true");
  } else {
    elTip.setAttribute("data-on","false");
  }
});
cv.addEventListener("mouseleave", () => elTip.setAttribute("data-on","false"));

function frame(now){
  const dt = Math.min(0.1, (now - lastFrame)/1000);
  lastFrame = now;
  if (playing){
    simSec += dt * minutesPerSecond * 60;
    if (simSec >= DAY_SECONDS) simSec -= DAY_SECONDS;
  }
  draw();
  requestAnimationFrame(frame);
}

new ResizeObserver(resize).observe(stage);
resize();
document.getElementById("datum").textContent =
  new Date(DATA.date+"T12:00:00Z").toLocaleDateString("en-GB",
    {weekday:"long", day:"numeric", month:"long", year:"numeric", timeZone:"UTC"});
document.getElementById("loading").hidden = true;
requestAnimationFrame(frame);

})();
</script>
</body>
